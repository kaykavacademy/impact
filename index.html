<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A prototype of KayKav's impact measurement system: what builders create after the programme, and what becomes of it.">
<meta property="og:title" content="KayKav Builder Impact">
<meta property="og:description" content="Prototype — illustrative data. Every figure shows the strength of its evidence.">
<meta property="og:type" content="website">
<title>KayKav Builder Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202F; --ink2:#42536A; --ink3:#6E7F94;
  --paper:#EDF0F4; --surface:#FFFFFF; --surface2:#F7F9FB;
  --rule:#D5DCE5; --rule2:#E6EBF1;
  --blue:#295898; --blue-ink:#1D4275; --blue-tint:#E6EDF6;
  --gold:#B18C54; --gold-tint:#F4ECDE;
  --c0:#93A1B1; --c1:#7E9CC6; --c2:#295898; --c3:#B18C54;
  --c0-tint:#EAEDF1; --c1-tint:#E6EDF6; --c2-tint:#DCE6F3; --c3-tint:#F4ECDE;
  --shadow:0 1px 2px rgba(20,32,47,.06), 0 8px 24px -16px rgba(20,32,47,.28);
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --serif:'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EDF4; --ink2:#A9B8CA; --ink3:#7F90A5;
    --paper:#0E151E; --surface:#161F2B; --surface2:#1B2633;
    --rule:#2B3747; --rule2:#232E3C;
    --blue:#7BA5DC; --blue-ink:#A6C4EB; --blue-tint:#1B2B3F;
    --gold:#D3AF7B; --gold-tint:#2B2318;
    --c0:#7C8B9C; --c1:#6E92C4; --c2:#7BA5DC; --c3:#D3AF7B;
    --c0-tint:#212B37; --c1-tint:#1B2B3F; --c2-tint:#1B2B3F; --c3-tint:#2B2318;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EDF4; --ink2:#A9B8CA; --ink3:#7F90A5;
  --paper:#0E151E; --surface:#161F2B; --surface2:#1B2633;
  --rule:#2B3747; --rule2:#232E3C;
  --blue:#7BA5DC; --blue-ink:#A6C4EB; --blue-tint:#1B2B3F;
  --gold:#D3AF7B; --gold-tint:#2B2318;
  --c0:#7C8B9C; --c1:#6E92C4; --c2:#7BA5DC; --c3:#D3AF7B;
  --c0-tint:#212B37; --c1-tint:#1B2B3F; --c2-tint:#1B2B3F; --c3-tint:#2B2318;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--blue-ink)}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.kk-top{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:10px 20px; background:var(--surface);
  border-bottom:1px solid var(--rule);
}
.kk-wordmark{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.kk-wordmark b{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.015em}
.kk-wordmark span{font-size:12.5px;color:var(--ink3)}
.kk-demo{
  font-size:11.5px; color:var(--gold); border:1px dashed var(--gold);
  padding:2px 8px; border-radius:999px; background:var(--gold-tint); white-space:nowrap;
}
.kk-modes{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--rule);border-radius:999px;padding:3px}
.kk-modes button{padding:5px 13px;border-radius:999px;font-size:13px;color:var(--ink2)}
.kk-modes button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:500}
.kk-theme{width:32px;height:32px;border:1px solid var(--rule);border-radius:8px;display:grid;place-items:center;color:var(--ink3)}

.kk-body{display:flex;min-height:calc(100vh - 53px);align-items:stretch}
.kk-rail{
  flex:0 0 218px; background:var(--surface); border-right:1px solid var(--rule);
  padding:18px 12px 40px; position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;
}
.kk-rail h6{margin:16px 8px 6px;font-size:11.5px;font-weight:500;color:var(--ink3);letter-spacing:.01em}
.kk-rail h6:first-child{margin-top:0}
.kk-navitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 9px;border-radius:7px;font-size:14px;color:var(--ink2);
}
.kk-navitem:hover{background:var(--surface2)}
.kk-navitem[aria-current="page"]{background:var(--blue-tint);color:var(--blue-ink);font-weight:500}
.kk-navitem .kk-count{margin-left:auto;font-size:11.5px;font-variant-numeric:tabular-nums;
  background:var(--gold);color:#fff;border-radius:999px;padding:1px 7px;font-weight:500}
.kk-main{flex:1;min-width:0;padding:30px 34px 90px;max-width:1180px}

@media (max-width:860px){
  .kk-body{display:block}
  .kk-rail{position:static;height:auto;width:100%;flex:none;display:flex;gap:6px;overflow-x:auto;
    padding:10px 14px;border-right:none;border-bottom:1px solid var(--rule)}
  .kk-rail h6{display:none}
  .kk-navitem{width:auto;white-space:nowrap;padding:6px 11px}
  .kk-main{padding:22px 16px 80px}
  .kk-wordmark span{display:none}
}

/* ---------- headings ---------- */
.kk-h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,34px);line-height:1.15;
  letter-spacing:-.018em;margin:0 0 6px}
.kk-lede{color:var(--ink2);margin:0 0 26px;max-width:62ch;font-size:15px}
.kk-h2{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em;margin:0 0 3px}
.kk-sub{color:var(--ink3);font-size:13px;margin:0 0 14px;max-width:70ch}
.kk-section{margin:38px 0 0}
.kk-section:first-of-type{margin-top:0}

/* ---------- surfaces ---------- */
.kk-panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
.kk-panel + .kk-panel{margin-top:14px}
.kk-grid{display:grid;gap:14px}
.kk-grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kk-grid.three{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}

/* ---------- confidence meter ---------- */
.kk-conf{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.kk-conf-bars{display:inline-flex;gap:2px}
.kk-conf-bars i{width:5px;height:11px;border-radius:1.5px;background:var(--rule);display:block}
.kk-conf[data-c="0"] i.on{background:var(--c0)}
.kk-conf[data-c="1"] i.on{background:var(--c1)}
.kk-conf[data-c="2"] i.on{background:var(--c2)}
.kk-conf[data-c="3"] i.on{background:var(--c3)}
.kk-conf small{font-size:11.5px;color:var(--ink3)}
.kk-conf[data-c="3"] small{color:var(--gold)}
.kk-conf[data-c="2"] small{color:var(--blue-ink)}

/* figures dim as confidence drops — the core visual rule */
.kk-fig{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.kk-fig[data-c="0"]{color:var(--ink3);font-weight:300}
.kk-fig[data-c="1"]{color:var(--ink2);font-weight:400}
.kk-fig[data-c="2"]{color:var(--ink);font-weight:500}
.kk-fig[data-c="3"]{color:var(--ink);font-weight:600}
.kk-fig.unknown{color:var(--ink3);font-weight:300;font-style:italic;font-size:.62em;letter-spacing:0}

.kk-metric{display:flex;flex-direction:column;gap:7px}
.kk-metric .kk-fig{font-size:clamp(28px,3.6vw,38px)}
.kk-metric .kk-fig.unknown{font-size:17px}
.kk-metric .kk-lab{font-size:13px;color:var(--ink2)}
.kk-metric .kk-note{font-size:11.5px;color:var(--ink3)}
button.kk-metric{text-align:left;align-items:flex-start;width:100%;
  border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:16px 17px}
button.kk-metric:hover{border-color:var(--blue);background:var(--surface2)}

/* ---------- funnel ---------- */
.kk-funnel{display:flex;flex-direction:column;gap:3px}
.kk-frow{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:14px;align-items:center;
  width:100%;text-align:left;padding:5px 6px;border-radius:7px}
.kk-frow:hover{background:var(--surface2)}
.kk-frow .kk-flab{font-size:13.5px;color:var(--ink2)}
.kk-frow .kk-flab em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3)}
.kk-ftrack{display:flex;align-items:center;gap:10px;min-width:0}
.kk-fbar{height:26px;border-radius:3px;background:var(--blue-tint);display:flex;overflow:hidden;
  min-width:3px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.kk-fbar i{display:block;height:100%;background:var(--blue);transition:width .5s}
.kk-fbar.gold{background:var(--gold-tint)}
.kk-fbar.gold i{background:var(--gold)}
.kk-fcount{font-family:var(--serif);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- ladder ---------- */
.kk-pips{display:inline-flex;gap:2px}
.kk-pips i{width:7px;height:7px;border-radius:2px;background:var(--rule2);display:block}
.kk-pips i.on{background:var(--blue)}
.kk-pips i.on.gold{background:var(--gold)}
.kk-ladder{display:flex;flex-direction:column;gap:0;margin:4px 0 0}
.kk-step{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid var(--rule2)}
.kk-step:last-child{border-bottom:none}
.kk-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--rule);margin-top:3px;background:var(--surface)}
.kk-step.done .kk-dot{background:var(--blue);border-color:var(--blue)}
.kk-step.done.gold .kk-dot{background:var(--gold);border-color:var(--gold)}
.kk-step.now .kk-dot{box-shadow:0 0 0 4px var(--blue-tint)}
.kk-step .kk-sname{font-size:14px;font-weight:500}
.kk-step.todo .kk-sname{color:var(--ink3);font-weight:400}
.kk-step .kk-sdesc{font-size:12.5px;color:var(--ink3);margin-top:1px}
.kk-step .kk-sdate{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- tables ---------- */
.kk-tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table.kk-table{border-collapse:collapse;width:100%;min-width:660px;font-size:13.5px}
.kk-table th{
  text-align:left;font-weight:500;font-size:12px;color:var(--ink3);
  padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface2);white-space:nowrap;
}
.kk-table td{padding:11px 14px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.kk-table tr:last-child td{border-bottom:none}
.kk-table tbody tr:hover{background:var(--surface2)}
.kk-rowlink{cursor:pointer}
.kk-rowlink:hover,.kk-rowlink:focus-within{background:var(--surface2)}
.kk-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kk-linkcell{font-weight:500;color:var(--blue-ink);text-align:left}
.kk-linkcell:hover{text-decoration:underline}
.kk-muted{color:var(--ink3)}
.kk-gapcell{color:var(--ink3);font-style:italic;font-size:12.5px}

/* ---------- pills / chips ---------- */
.kk-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;
  border-radius:999px;background:var(--surface2);border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.kk-pill.blue{background:var(--blue-tint);border-color:transparent;color:var(--blue-ink)}
.kk-pill.gold{background:var(--gold-tint);border-color:transparent;color:var(--gold)}
.kk-pill.gap{border-style:dashed;color:var(--ink3);background:transparent}
.kk-chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.kk-chip{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink2)}
.kk-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kk-chipgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.kk-chipgroup > span{font-size:12px;color:var(--ink3);margin-right:1px}

/* ---------- buttons ---------- */
.kk-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;
  background:var(--blue);color:#fff;font-size:13.5px;font-weight:500}
.kk-btn:hover{background:var(--blue-ink)}
.kk-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--rule)}
.kk-btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.kk-btn.gold{background:var(--gold)}
.kk-btn.sm{padding:5px 11px;font-size:12.5px}
.kk-btn:disabled{opacity:.45;cursor:not-allowed}
.kk-back{font-size:13px;color:var(--ink3);margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}
.kk-back:hover{color:var(--blue-ink)}

/* ---------- forms ---------- */
.kk-field{margin:0 0 18px}
.kk-field label{display:block;font-size:14px;font-weight:500;margin-bottom:3px}
.kk-field .kk-help{font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.kk-input, .kk-select, .kk-textarea{
  width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px
}
.kk-textarea{min-height:76px;resize:vertical}
.kk-radios{display:flex;flex-wrap:wrap;gap:8px}
.kk-radio{border:1px solid var(--rule);border-radius:8px;padding:8px 14px;font-size:13.5px;
  background:var(--surface);color:var(--ink2)}
.kk-radio[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint);color:var(--blue-ink);font-weight:500}
.kk-steps{display:flex;gap:6px;margin-bottom:22px;align-items:center;flex-wrap:wrap}
.kk-stepdot{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.kk-stepdot b{width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:11px;font-weight:500}
.kk-stepdot.on b{background:var(--blue);border-color:var(--blue);color:#fff}
.kk-stepdot.on{color:var(--ink)}

/* ---------- drawer ---------- */
.kk-scrim{position:fixed;inset:0;background:rgba(16,24,36,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.kk-scrim.open{opacity:1;pointer-events:auto}
.kk-drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface);
  border-left:1px solid var(--rule);z-index:61;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column}
.kk-drawer.open{transform:none}
.kk-drawer header{padding:18px 22px 12px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.kk-drawer header h3{margin:0;font-family:var(--serif);font-weight:500;font-size:18px}
.kk-drawer header p{margin:2px 0 0;font-size:12.5px;color:var(--ink3)}
.kk-drawer .kk-dbody{padding:16px 22px 40px;overflow-y:auto}
.kk-x{margin-left:auto;font-size:20px;line-height:1;color:var(--ink3);padding:2px 6px}

/* ---------- toast ---------- */
.kk-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:70;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:9px;font-size:13.5px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .22s;max-width:90vw}
.kk-toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- misc ---------- */
.kk-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.kk-kv dt{color:var(--ink3)}
.kk-kv dd{margin:0}
.kk-evidence{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule2);align-items:flex-start}
.kk-evidence:last-child{border-bottom:none}
.kk-evicon{width:30px;height:30px;border-radius:7px;background:var(--surface2);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:14px;flex:none}
.kk-gapline{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--rule);font-size:13.5px}
.kk-gapline:last-child{border-bottom:none}
.kk-gapline b{font-family:var(--serif);font-weight:500;font-size:16px;color:var(--gold);
  font-variant-numeric:tabular-nums;min-width:52px}
.kk-story{border-left:2px solid var(--rule);padding-left:18px;margin:0 0 4px}
.kk-story h4{margin:0 0 2px;font-size:12.5px;color:var(--ink3);font-weight:500}
.kk-story p{margin:0 0 16px;font-size:14px;max-width:64ch}
.kk-q{border-bottom:1px solid var(--rule2)}
.kk-q summary{padding:13px 2px;cursor:pointer;font-size:15px;font-weight:500;list-style:none;display:flex;gap:10px;align-items:center}
.kk-q summary::-webkit-details-marker{display:none}
.kk-q summary::before{content:"+";color:var(--ink3);font-weight:400;width:14px}
.kk-q[open] summary::before{content:"−"}
.kk-q .kk-qa{padding:0 2px 18px 24px}
.kk-hair{height:1px;background:var(--rule);border:none;margin:26px 0}
.kk-public-hero{background:var(--ink);color:var(--paper);border-radius:14px;padding:clamp(26px,5vw,52px)}
.kk-public-hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,46px);
  line-height:1.08;letter-spacing:-.02em;margin:0 0 10px;max-width:18ch}
.kk-public-hero p{color:color-mix(in srgb, var(--paper) 82%, var(--ink));max-width:52ch;margin:0;font-size:15.5px}
.kk-public-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px;margin-top:38px}
.kk-public-nums b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.6vw,42px);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kk-public-nums span{font-size:12.5px;color:color-mix(in srgb, var(--paper) 68%, var(--ink))}
.kk-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kk-card{border:1px solid var(--rule);border-radius:10px;padding:16px 17px;background:var(--surface);text-align:left;width:100%}
.kk-card:hover{border-color:var(--blue)}
.kk-card h5{margin:0 0 4px;font-size:15px;font-weight:600;font-family:var(--serif)}
.kk-card p{margin:0 0 11px;font-size:13px;color:var(--ink2);min-height:2.6em}
.kk-empty{border:1px dashed var(--rule);border-radius:10px;padding:26px;text-align:center;color:var(--ink3);font-size:14px}
.kk-flag{display:flex;gap:11px;padding:13px 15px;border-radius:9px;background:var(--gold-tint);
  border:1px solid rgba(177,140,84,.3);font-size:13px;color:var(--ink2);margin-bottom:22px}
.kk-flag b{color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<div class="kk-scrim" id="scrim"></div>
<aside class="kk-drawer" id="drawer" aria-hidden="true"></aside>
<div class="kk-toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =========================================================================
   KayKav Builder Impact — clickable prototype
   All figures below are ILLUSTRATIVE seed data for interface testing.
   Documented facts (cohort dates, enrolment, countries, participant and
   product names) come from the Impact Measurement Framework v1.
   Everything else is placeholder and must never be reported as result.
   ========================================================================= */

const TODAY = new Date('2026-09-16');

/* ---- reference ladders ---------------------------------------------- */
const LEVELS = [
  {n:0, name:'Idea',      desc:'A defined problem exists, no meaningful build has started.'},
  {n:1, name:'Built',     desc:'A functional MVP exists and can do its core job.'},
  {n:2, name:'Deployed',  desc:'Accessible on a live URL or production environment.'},
  {n:3, name:'Validated', desc:'A real user outside the build process has used it for its purpose.'},
  {n:4, name:'Active',    desc:'Meaningful usage in the last 30 days.'},
  {n:5, name:'Traction',  desc:'Sustained or growing adoption.'},
  {n:6, name:'Revenue',   desc:'At least one real customer has paid.'},
  {n:7, name:'Business',  desc:'An ongoing commercial or organisational operation.'},
  {n:8, name:'Scale',     desc:'Substantial, sustained growth beyond initial validation.'}

/* =========================== demo seed ==============================
   GENERATED SAMPLE DATA — not programme data.

   Everything below is synthesised so the dashboard reads as a populated
   system in a walkthrough. It is deterministic: the same seed produces
   the same records on every load, so screenshots stay stable.

   The hand-written records above (the named Cohort 01 and Cohort 02
   products, and their builders) are left untouched. Nothing here is a
   measurement, and no figure generated here should be reported.

   To strip the demo layer, delete this block and the seedDemo() call.
==================================================================== */
function seedDemo(){
  let s = 20260917;                                   // fixed seed
  const rnd  = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const int  = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
  const pick = a => a[Math.floor(rnd() * a.length)];
  const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // cohort 01 ran Apr-May 2026, cohort 02 Jul-Aug 2026, so their records start apart
  const BASE = {bnp01: Date.UTC(2026, 4, 10), bnp02: Date.UTC(2026, 7, 10)};
  const dayFrom = (base, n) => new Date(base + n * 864e5).toISOString().slice(0, 10);
  const day  = n => dayFrom(BASE.bnp01, n);

  /* Names are invented stand-ins for people who are not in the record yet.
     They follow the house style already used for the fictional Cohort 01
     placeholders ("Tola A.") — a given name with a surname initial — so a
     generated row never reads as a fully identified individual. */
  const NG = ['Adebayo','Adeola','Ayodele','Babatunde','Bolanle','Damilola','Folake','Funmilayo','Gbenga','Kehinde',
    'Kunle','Olamide','Oluwaseun','Omolara','Segun','Simisola','Temitope','Titilayo','Yetunde','Abiodun','Sade',
    'Adaeze','Amaka','Chiamaka','Chidinma','Chika','Chinaza','Chinedu','Ebele','Ekene','Emeka','Ifeanyi','Ifeoma',
    'Kelechi','Ngozi','Nkechi','Nneka','Obinna','Uzoma','Chukwuma','Ucheoma',
    'Aisha','Amina','Fatima','Halima','Hauwa','Ibrahim','Idris','Maryam','Musa','Sadiq','Suleiman','Yusuf','Zainab',
    'Bashir','Aminu','Bassey','Efe','Itoro','Osas','Ovie','Preye','Tamuno'];
  const SE = ['Erik','Astrid','Karin','Anders','Elin','Lars','Ingrid','Johan'];
  const IE = ['Niamh','Sinead','Conor','Maeve','Liam','Fiona','Declan','Aoife'];
  const WEST = ['Marcus','Grace','Daniel','Hannah','Peter','Claire','Nathan','Ruth'];
  const SURNAME = 'ABCDEFGHIJKLMNOPRSTUVWY'.split('');
  // Sweden and Ireland draw local names. Nigeria is Nigerian. The UK, US and
  // Canada are mostly Nigerian diaspora, which is what the real rows show.
  const namePool = c => c === 'Sweden' ? SE : c === 'Ireland' ? IE
                      : c === 'Nigeria' ? NG : (rnd() > 0.7 ? WEST : NG);
  // an honorific only where the background earns one
  const titleFor = bg =>
    /engineer|surveyor/i.test(bg) ? (rnd() > 0.45 ? 'Engr. ' : '') :
    /pharmacist/i.test(bg)        ? (rnd() > 0.35 ? 'Pharm. ' : '') :
    /laboratory|radiographer|public health/i.test(bg) ? (rnd() > 0.6 ? 'Dr. ' : '') : '';
  const CO_BNP01 = ['Nigeria','Nigeria','Nigeria','Nigeria','Nigeria','United Kingdom','United States','Canada','Sweden','Ireland'];
  const BACKGROUND = ['Clinic administrator','Secondary school teacher','Logistics coordinator','Credit analyst',
    'Public health officer','Civil engineer','Pharmacist','Procurement officer','Laboratory scientist','Estate surveyor',
    'Insurance broker','Agricultural extension officer','Bank relationship manager','School administrator','HR officer',
    'Radiographer','Tax consultant','Quantity surveyor','Community health worker','Transport planner','Records officer',
    'Quality manager','Municipal planner','Veterinary officer','Payroll officer'];
  const DOMAIN = ['Healthcare','Agriculture','Education','Retail','Construction','Financial services','Legal',
    'Logistics','Public sector','Energy','Professional services','Nutrition'];
  const A = ['Clinic','Farm','Site','Ward','Ledger','Route','Shelf','Case','Roster','Track','Med','Agro','Stock',
    'Claim','Tutor','Fleet','Grant','Permit','Lab','Yield','Care','Desk','Pay','Audit','Bill','Crop','Dose','Fix',
    'Gate','Hive','Join','Kiln','Loop','Mark','Note','Pulse','Quay','Rail','Sort','Tally'];
  const B = ['Track','Desk','Flow','Log','Book','Board','Point','Hub','Line','Pilot','Sync','Bridge','Watch','Path',
    'Base','Wise','Ly','Mate','Grid','Deck'];

  /* ---- builders: 47 additional records, split across both cohorts ---
     22 join Cohort 01 and 25 Cohort 02, so neither cohort looks like the
     whole programme. Cohort 02 stays Nigeria-only, which is what the
     record actually says, so no new country reach is invented. */
  const takenNames = new Set(DB.builders.map(b => (b.name || '').toLowerCase()));
  const personName = (country, bg) => {
    for(;;){
      const n = titleFor(bg) + pick(namePool(country)) + ' ' + pick(SURNAME) + '.';
      if(!takenNames.has(n.toLowerCase())){ takenNames.add(n.toLowerCase()); return n; }
    }
  };

  const newBuilders = [];
  for(let i = 0; i < 47; i++){
    const cohortId = i < 22 ? 'bnp01' : 'bnp02';
    const country  = cohortId === 'bnp01' ? pick(CO_BNP01) : 'Nigeria';
    const background = pick(BACKGROUND);
    newBuilders.push({
      id: 'g' + String(i + 1).padStart(2, '0'),
      name: personName(country, background),
      country,
      background,
      cohortId,
      completed: rnd() > 0.08,
      continuing: rnd() > 0.34 ? 'yes' : (rnd() > 0.5 ? 'unknown' : 'no')
    });
  }
  DB.builders.push(...newBuilders);

  /* ---- products: an explicit level plan, so the funnel is exact ----
     Totals after seeding: 74 records, 72 built, 70 deployed,
     41 validated, 27 active, 14 with traction, 6 revenue, 1 business. */
  const levelPlan = shuffle([].concat(
    Array(2).fill(0), Array(1).fill(1), Array(20).fill(2), Array(11).fill(3),
    Array(11).fill(4), Array(7).fill(5),  Array(3).fill(6),  Array(1).fill(7)));

  // one product per builder, then 9 builders get a second
  const owners = newBuilders.map(b => b.id);
  const extra  = shuffle(owners.slice()).slice(0, 9);
  const ownerPlan = owners.concat(extra);

  // the unbuilt (level 0) records go last, onto builders who already have a built one,
  // so every seeded builder still counts as a builder with at least one build
  const plan = levelPlan.filter(l => l !== 0).concat(levelPlan.filter(l => l === 0));
  const ownersOrdered = owners.concat(extra);

  const used = new Set(DB.products.map(p => (p.name || '').toLowerCase()));
  const nameFor = () => { for(;;){ const n = pick(A) + pick(B); if(!used.has(n.toLowerCase())){ used.add(n.toLowerCase()); return n; } } };

  plan.forEach((level, i) => {
    const owner = byId(DB.builders, ownersOrdered[i]);
    const id = 'gp' + String(i + 1).padStart(2, '0');
    const base = BASE[owner.cohortId];
    const t0 = int(0, 40);
    const history = {};
    for(let l = 1; l <= level; l++) history[l] = dayFrom(base, t0 + (l - 1) * int(12, 34));

    // evidence gradient: most claims are weak, a few are checked, gaps stay gaps
    const conf = () => { const r = rnd(); return r > 0.88 ? 3 : r > 0.62 ? 2 : r > 0.3 ? 1 : 0; };
    const src  = c => ['Builder check-in','Screenshot attached by the builder','Reviewed by a KayKav reviewer','Read from a connected system'][c];
    const seen = dayFrom(base, t0 + 60 + int(0, 60));
    const users = level >= 3 ? int(12, 1400) : null;
    const mau   = level >= 4 && users ? Math.round(users * (0.25 + rnd() * 0.45)) : null;
    const rev   = level >= 6 ? int(40, 2600) : null;

    const metrics = {
      users:   users !== null && rnd() > 0.1 ? m(users, conf(), src(conf()), seen) : gap('No check-in returned'),
      mau:     mau   !== null && rnd() > 0.2 ? m(mau, conf(), 'Builder check-in', seen) : gap(),
      paying:  level >= 6 ? m(int(1, 14), rnd() > 0.5 ? 2 : 1, 'Payment provider export', seen) : gap(),
      revenue: rev !== null ? m(rev, rnd() > 0.45 ? 2 : 0, 'Payment provider export', seen) : gap(),
      mrr:     level >= 6 && rnd() > 0.4 ? m(int(15, 320), 1, 'Builder check-in', seen) : gap(),
      orgs:    level >= 5 && rnd() > 0.45 ? m(int(2, 11), 2, 'Organisation names supplied and checked', seen) : gap()
    };

    const timeline = [];
    if(level >= 3 && users){
      timeline.push({d:30, date:dayFrom(base, t0 + 30), users:Math.round(users * 0.35), revenue:0});
      if(level >= 4) timeline.push({d:90, date:dayFrom(base, t0 + 90), users:Math.round(users * 0.78), revenue:rev ? Math.round(rev * 0.4) : 0});
    }

    const nm  = nameFor();
    const tld = pick(['.app','.co','.ng','.io','.online']);

    DB.products.push({
      id, name:nm, aka:null, builderId:owner.id, cohortId:owner.cohortId,
      domain:pick(DOMAIN), country:owner.country,
      url: level >= 2 ? nm.toLowerCase() + tld : null,
      desc:'Generated sample record for demonstration.',
      level, history, metrics,
      impact: level >= 4 && rnd() > 0.55
        ? [{label:pick(['People served','Records processed','Sites covered','Cases handled']), value:int(40, 4200), conf:rnd() > 0.5 ? 2 : 1}]
        : [],
      timeline
    });
  });

  /* ---- keep cohort record counts consistent with the seeded rows --- */
  ['bnp01','bnp02'].forEach(cid => {
    const c = byId(DB.cohorts, cid);
    c.recorded = DB.builders.filter(b => b.cohortId === cid).length;
    const shipped = DB.products.filter(p => p.cohortId === cid && p.level >= 2).length;
    const behind  = c.enrolled - c.recorded;
    c.note = shipped + ' live products shipped. ' +
             (behind > 0 ? behind + ' participant records still to be backfilled.'
                         : 'Every participant has a record.');
  });

  DB.checkins.forEach(c => {
    const held = byId(DB.cohorts, c.cohortId).recorded;
    c.expected = held;
    if(c.returned) c.returned = Math.round(held * (c.window === 30 ? 0.64 : 0.41));
  });

  /* ---- a fuller verification queue --------------------------------- */
  const claimable = DB.products.filter(p => p.id.startsWith('gp') && p.level >= 3);
  shuffle(claimable).slice(0, 8).forEach((p, i) => {
    const b = builderOf(p);
    DB.queue.push({
      id:'gq' + (i + 1), productId:p.id,
      metric:pick(['users','revenue','orgs']),
      claim:pick([fmt(int(60, 900)) + ' registered users', fmt(int(3, 40)) + ' paying customers',
                  int(2, 9) + ' organisations using it weekly', fmt(int(100, 2000)) + ' records processed this month']),
      evidence:pick(['Dashboard screenshot','Payment provider export','Named contact supplied','Analytics connection requested']),
      from:b ? b.name : '—', date:day(int(100, 130)), status:'pending'
    });
  });
}

/* =========================== helpers ================================ */
const $ = s => document.querySelector(s);
const byId = (arr,id) => arr.find(x => x.id === id);
const fmt = n => n === null || n === undefined ? '—' : n.toLocaleString('en-US');
const money = n => n === null || n === undefined ? '—' : '$' + n.toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';
const dtShort = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'}) : '—';
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

const productName = p => !p ? 'your product' : (p.name || 'Unnamed product (' + p.id.toUpperCase() + ')');
const builderName = b => b && b.name ? b.name : 'Name pending backfill';
const builderOf = p => byId(DB.builders, p.builderId);
const cohortOf = x => byId(DB.cohorts, x.cohortId);
const productsOf = bid => DB.products.filter(p => p.builderId === bid);

function confMeter(c, withLabel){
  if(c === null || c === undefined) return '<span class="kk-pill gap">No data</span>';
  const bars = [0,1,2,3].map(i => '<i class="' + (i <= c ? 'on' : '') + '"></i>').join('');
  return '<span class="kk-conf" data-c="' + c + '" title="' + esc(CONF[c].name + ' — ' + CONF[c].desc) + '">' +
    '<span class="kk-conf-bars">' + bars + '</span>' +
    (withLabel === false ? '' : '<small>' + CONF[c].name + '</small>') + '</span>';
}

/* a measurement rendered at its own confidence weight */
function figure(mo, opts){
  opts = opts || {};
  const f = opts.format || fmt;
  if(!mo || mo.value === null || mo.value === undefined){
    return '<span class="kk-fig unknown">' + esc(opts.gapText || (mo && mo.why) || 'Not collected') + '</span>';
  }
  return '<span class="kk-fig" data-c="' + mo.conf + '">' + f(mo.value) + '</span>';
}

function levelPips(level){
  const gold = level >= 5;
  return '<span class="kk-pips" title="' + esc('Level ' + level + ' — ' + LEVELS[level].name) + '">' +
    LEVELS.map(l => '<i class="' + (l.n <= level ? 'on' + (gold ? ' gold' : '') : '') + '"></i>').join('') + '</span>';
}
function levelPill(level){
  const cls = level >= 5 ? 'gold' : level >= 2 ? 'blue' : '';
  return '<span class="kk-pill ' + cls + '">' + LEVELS[level].name + '</span>';
}

/* =========================== aggregates ============================= */
function agg(){
  const P = DB.products;
  const atLeast = n => P.filter(p => p.level >= n);
  const enrolled = DB.cohorts.reduce((s,c) => s + c.enrolled, 0);

  const knownUsers = P.filter(p => p.metrics.users && p.metrics.users.value !== null);
  const usersReached = knownUsers.reduce((s,p) => s + p.metrics.users.value, 0);
  const revenueProducts = P.filter(p => p.metrics.revenue && p.metrics.revenue.value > 0);
  const revenueTotal = revenueProducts.reduce((s,p) => s + p.metrics.revenue.value, 0);
  const revenueVerified = revenueProducts.filter(p => p.metrics.revenue.conf >= 2)
                                         .reduce((s,p) => s + p.metrics.revenue.value, 0);

  let known = 0, verified = 0;
  P.forEach(p => Object.values(p.metrics).forEach(mo => {
    if(mo && mo.value !== null){ known++; if(mo.conf >= 2) verified++; }
  }));

  const continuing = DB.builders.filter(b => b.continuing === 'yes').length;
  const contUnknown = DB.builders.filter(b => b.continuing === 'unknown').length;

  // survival: share of deployed products in a cohort still at Active or above
  const survival = (cohortId, win) => {
    const c = byId(DB.cohorts, cohortId);
    const elapsed = Math.round((TODAY - new Date(c.demoDay + 'T00:00:00')) / 86400000);
    if(elapsed < win) return {due:false, elapsed};
    const shipped = P.filter(p => p.cohortId === cohortId && p.level >= 2);
    const alive = shipped.filter(p => (p.timeline.find(t => t.d === win) || {}).users > 0 || p.level >= 4);
    const answered = shipped.filter(p => p.timeline.some(t => t.d === win) || p.level >= 4);
    return {due:true, alive:alive.length, of:shipped.length, answered:answered.length, elapsed};
  };

  return {
    enrolled,
    builderRecords: DB.builders.length,
    buildersWithProduct: DB.builders.filter(b => productsOf(b.id).some(p => p.level >= 1)).length,
    products: P.length,
    built: atLeast(1).length, deployed: atLeast(2).length, validated: atLeast(3).length,
    active: atLeast(4).length, traction: atLeast(5).length, revenueLv: atLeast(6).length,
    business: atLeast(7).length, scale: atLeast(8).length,
    usersReached, usersKnownOn: knownUsers.length,
    revenueTotal, revenueVerified, revenueProducts: revenueProducts.length,
    countries: [...new Set(P.map(p => p.country).filter(Boolean))].length,
    cohortCountries: [...new Set(DB.cohorts.flatMap(c => c.countries))].length,
    known, verified, verifiedShare: pct(verified, known),
    continuing, contUnknown,
    pending: DB.queue.filter(q => q.status === 'pending').length,
    checkinReturned: DB.checkins.reduce((s,c) => s + c.returned, 0),
    checkinExpected: DB.checkins.filter(c => new Date(c.due) <= TODAY).reduce((s,c) => s + c.expected, 0),
    survival
  };
}

    const w = Math.max(2, Math.round(r.n / max * 100));
    return '<button class="kk-frow" data-act="drill" data-arg="' + r.k + '">' +
      '<span class="kk-flab">' + esc(r.label) + '<em>' + esc(r.sub) + '</em></span>' +

  }).join('') + '</div>';
}

    return '<div class="' + cls + '"><span class="kk-dot"></span>' +

  const timeline = p.timeline.length

      '<div class="kk-ladder">' + ladder + '</div></div>' +

    '<div><div class="kk-panel"><h2 class="kk-h2">Identity</h2>' +
      '<dl class="kk-kv" style="margin-top:10px">' +
      '<dt>Builder</dt><dd><button class="kk-linkcell" data-act="go" data-arg="builder:' + p.builderId + '">' + esc(builderName(b)) + '</button></dd>' +

            esc(productName(p)) + ' to <b>' + LEVELS[q.promotesTo].name + '</b> and changes the funnel.</div></div>' : '') +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px;min-width:170px">' +
          '<div class="kk-muted" style="font-size:12px">Currently ' + (mo && mo.value !== null ? CONF[mo.conf].name.toLowerCase() : 'not recorded') + '</div>' +
          '<button class="kk-btn" data-act="verify" data-arg="' + q.id + '">Accept as verified</button>' +
          '<button class="kk-btn ghost sm" data-act="more" data-arg="' + q.id + '">Ask for more</button>' +
          '<button class="kk-btn ghost sm" data-act="reject" data-arg="' + q.id + '">Reject claim</button>' +
        '</div>' +
      '</div></div>';
  };

  return '' +
  '<h1 class="kk-h1">Verification queue</h1>' +
  '<p class="kk-lede">Nothing a builder reports is treated as fact until someone here looks at it. Accepting a claim raises its strength everywhere it appears, including the funder dashboard.</p>' +
  (pend.length ? pend.map(card).join('')
    : '<div class="kk-empty">Nothing is waiting. New claims arrive here when a builder returns a check-in with evidence attached.</div>') +
  (done.length ? '<section class="kk-section"><h2 class="kk-h2">Recently decided</h2>' +
    '<div class="kk-tablewrap"><table class="kk-table" style="min-width:0"><thead><tr><th>Product</th><th>Claim</th><th>Decision</th></tr></thead><tbody>' +
    done.map(q => '<tr><td>' + esc(productName(byId(DB.products, q.productId))) + '</td><td>' + esc(q.claim) + '</td>' +
    '<td>' + {verified:'<span class="kk-pill blue">Verified</span>',
              rejected:'<span class="kk-pill">Rejected</span>',
              more:'<span class="kk-pill gold">More asked for</span>'}[q.status] + '</td></tr>').join('') +
    '</tbody></table></div></section>' : '');
}

function decide(qid, verdict){
  const q = byId(DB.queue, qid);
  if(!q || q.status !== 'pending') return;
  const p = byId(DB.products, q.productId);
  const mo = p.metrics[q.metric];
  if(verdict === 'verified'){
    q.status = 'verified';
    if(mo) mo.conf = 2;
    if(mo) mo.source = 'Evidence checked by KayKav';
    if(mo) mo.date = '2026-09-16';
    if(q.promotesTo && p.level < q.promotesTo){
      p.level = q.promotesTo;
      p.history[q.promotesTo] = '2026-09-16';
      toast('Verified. ' + productName(p) + ' now sits at ' + LEVELS[q.promotesTo].name + ' and the funnel has moved.');
    } else {
      toast('Verified. ' + esc(q.claim) + ' now counts as checked.');
    }
  } else if(verdict === 'rejected'){
    q.status = 'rejected';
    if(mo) mo.conf = 0;
    toast('Rejected. The figure stays at self-reported.');
  } else {
    q.status = 'more';
    toast('Sent back to ' + q.from + ' for stronger evidence.');
  }
  render();
}

/* =========================== view: gaps ============================= */
function gapList(){
  const a = agg();
  const out = [];
  const missingBuilders = a.enrolled - a.builderRecords;
  if(missingBuilders > 0) out.push({n:missingBuilders, t:'participant records not yet backfilled',
    d:'Cohort 01 enrolled ' + byId(DB.cohorts,'bnp01').enrolled + ' people. ' +
       byId(DB.cohorts,'bnp01').recorded + ' appear here as records. The rest exist only in programme records.'});
  const unnamed = DB.products.filter(p => !p.name).length;
  if(unnamed) out.push({n:unnamed, t:'products with no name on record',
    d:'Counted in the shipped total but nothing else is known about them. Each one weakens every downstream figure.'});
  out.push({n:DB.noProduct.length, t:'builders with no product recorded',
    d:'They completed Cohort 02 but no product has been entered for them yet.'});
  const noUsers = DB.products.filter(p => p.level >= 2 && p.metrics.users.value === null).length;
  out.push({n:noUsers, t:'deployed products with no user data',
    d:'Deployed is not adopted. Without a figure here, adoption cannot be claimed for these products.'});
  out.push({n:a.checkinExpected - a.checkinReturned, t:'check-ins outstanding',
    d:'Every missing response is a product whose survival is unknown rather than zero.'});
  out.push({n:a.known - a.verified, t:'figures still unverified',
    d:'Recorded but resting on a claim or unchecked evidence.'});
  return out;
}

  const field = Q.opts
    ? '<div class="kk-radios">' + Q.opts.map(o =>
        '<button class="kk-radio" data-act="ci-pick" data-arg="' + Q.k + '::' + o + '" aria-pressed="' +

    : Q.input === 'number'

        '" value="' + (val ?? '') + '" placeholder="e.g. 40">'

  return '<div style="max-width:620px;margin:0 auto">' +
    '<button class="kk-back" data-act="checkin-cancel">← Leave the check-in</button>' +
    '<div class="kk-steps">' + CHECKIN_Q.map((q,i) =>
      '<span class="kk-stepdot' + (i <= step ? ' on' : '') + '"><b>' + (i + 1) + '</b></span>').join('') +

    '<div class="kk-panel">' +
      '<div class="kk-field"><label>' + esc(Q.q) + '</label>' +
      (Q.help ? '<div class="kk-help">' + esc(Q.help) + '</div>' : '') + field + '</div>' +
      '<div style="display:flex;gap:8px">' +

      '</div>' +
    '</div>' +
    '<p class="kk-sub" style="margin-top:14px">' + esc(productName(p)) +

function submitCheckin(){
  const b = byId(DB.builders, state.actingAs);
  let p = productsOf(b.id)[0];
  const d = state.checkin.draft;
  if(!p){
    p = {id:'p' + Date.now(), name:null, aka:null, builderId:b.id, cohortId:b.cohortId,
         domain:null, country:b.country, url:null,
         desc:'Entered from a 30-day check-in. Details still to be collected.',
         level:1, history:{1:'2026-09-16'},
         metrics:{users:gap(), mau:gap(), paying:gap(), revenue:gap(), mrr:gap(), orgs:gap()},
         impact:[], timeline:[]};
    DB.products.push(p);
    DB.noProduct = DB.noProduct.filter(x => x.builderId !== b.id);
  }

  if(d.users){
    p.metrics.users = {value:+d.users, conf:0, source:'Builder check-in', date:'2026-09-16'};
    p.timeline.push({d:30, date:'2026-09-16', users:+d.users, revenue:0});
  }
  if(d.outside === 'Yes' && p.level < 3){ p.level = 3; p.history[3] = '2026-09-16'; }
  if(d.running === 'Stopped for good') p.note = 'Builder reported stopping work at the 30-day check-in.';
  b.continuing = d.building && d.building.startsWith('Yes') ? 'yes' : d.building === 'No' ? 'no' : 'unknown';

  let mine = DB.builderCheckins.find(x => x.builderId === b.id && x.window === 30);
  if(!mine){
    mine = {builderId:b.id, productId:p.id, window:30, due:'2026-09-06', status:'overdue'};
    DB.builderCheckins.push(mine);
  }
  if(mine.status !== 'submitted'){
    mine.status = 'submitted'; mine.on = '2026-09-16';
    const ci = DB.checkins.find(x => x.cohortId === b.cohortId && x.window === 30);
    if(ci) ci.returned += 1;
  }
  if(d.evidence && d.evidence !== 'Nothing to attach' && d.users){
    DB.queue.unshift({id:'q' + Date.now(), productId:p.id, metric:'users',
      claim:fmt(+d.users) + ' users reported at the 30-day check-in',
      evidence:d.evidence === 'Connect my analytics' ? 'Analytics connection requested' : 'Screenshot attached by the builder',
      from:b.name, date:'2026-09-16', status:'pending'});
  }
  state.checkin.step = CHECKIN_Q.length;
  toast('Check-in received. Thank you.');
  render();
}

function drill(key){

      esc(productName(p)) + '</button></td><td>' + levelPill(p.level) + '</td><td class="kk-muted">' +
      (extra ? extra[1](p) : cohortOf(p).name.replace('BNP ','')) + '</td></tr>').join(''));

  const P = DB.products;
  const map = {
    trained:   () => ['People trained', a.enrolled + ' enrolled across ' + DB.cohorts.filter(c => c.enrolled).length + ' cohorts',
      table(['Cohort','Ran','Enrolled','Records held'], DB.cohorts.filter(c => c.enrolled).map(c =>

        '<td>' + c.enrolled + '</td><td>' + c.recorded + '</td></tr>').join('')) +
      '<p class="kk-sub" style="margin-top:12px">Cohort 01 holds ' + byId(DB.cohorts,'bnp01').recorded + ' of ' +
        byId(DB.cohorts,'bnp01').enrolled + ' participant records. The remaining ' +
        (byId(DB.cohorts,'bnp01').enrolled - byId(DB.cohorts,'bnp01').recorded) +
        ' sit in programme records and have not been backfilled.</p>'],
    builders:  () => ['Builders', 'Records with at least one product past the idea stage',
      table(['Builder','Cohort','Products'], DB.builders.filter(b => productsOf(b.id).some(p => p.level >= 1)).map(b =>
        '<tr><td><button class="kk-linkcell" data-act="go" data-arg="builder:' + b.id + '">' + esc(builderName(b)) +
        '</button></td><td class="kk-muted">' + cohortOf(b).name.replace('BNP ','') + '</td><td>' + productsOf(b.id).length + '</td></tr>').join(''))],
    built:     () => ['Products built', 'A functional MVP exists', plist(P.filter(p => p.level >= 1))],
    deployed:  () => ['Products deployed', 'Reachable on a live URL', plist(P.filter(p => p.level >= 2), ['Address', p => p.url || '<span class="kk-gapcell">none on record</span>'])],
    validated: () => ['Used by a real person', 'Level 3 and above', plist(P.filter(p => p.level >= 3))],
    active:    () => ['Active products', 'Usage in the last 30 days', plist(P.filter(p => p.level >= 4))],
    traction:  () => ['Products with traction', 'Sustained or growing adoption', plist(P.filter(p => p.level >= 5))],
    revenue:   () => ['Revenue', money(a.revenueVerified) + ' verified of ' + money(a.revenueTotal) + ' reported',
      table(['Product','Revenue','Strength'], P.filter(p => p.metrics.revenue.value > 0).map(p =>
        '<tr><td><button class="kk-linkcell" data-act="go" data-arg="product:' + p.id + '">' + esc(productName(p)) +
        '</button></td><td>' + money(p.metrics.revenue.value) + '</td><td>' + confMeter(p.metrics.revenue.conf) + '</td></tr>').join('')) +
      '<p class="kk-sub" style="margin-top:12px">Programme fees, sponsorship and grants are never counted here.</p>'],
    business:  () => ['Businesses', 'None yet',
      '<div class="kk-empty">No product has yet become an ongoing commercial operation. Showing a zero here is the point: the funnel is not padded at the bottom.</div>'],
    users:     () => ['People reached', fmt(a.usersReached) + ' known across ' + a.usersKnownOn + ' of ' + a.products + ' products',

        '<tr><td>' + esc(builderName(b)) + '</td><td>' +
        ({yes:'<span class="kk-pill blue">Still building</span>', no:'<span class="kk-pill">Stopped</span>',
          unknown:'<span class="kk-pill gap">Unreached</span>'})[b.continuing] + '</td></tr>').join(''))]
  };
  const f = map[key];
  if(!f) return;
  const [t, s, body] = f();
  openDrawer(esc(t), esc(s), body);
}

/* =========================== router ================================= */
function render(){
  const r = state.route;
  let inner = '';
  if(state.mode === 'public')      inner = vPublic();
  else if(state.mode === 'builder')inner = vBuilderHome();
  else if(r.name === 'product')    inner = vProduct(r.id);
  else if(r.name === 'builder')    inner = vBuilder(r.id);
  else inner = ({
    overview:vOverview, products:vProducts, builders:vBuilders, checkins:vCheckins,
    verify:vVerify, stories:vStories, gaps:vGaps, dictionary:vDictionary,
    funder:vFunder, trust:vTrust
  }[r.name] || vOverview)();
  $('#app').innerHTML = shell(inner);
  window.scrollTo({top:0});
}

function go(arg){
  const [name, id] = arg.split(':');
  state.route = {name, id};
  closeDrawer();
  render();
}

/* =========================== events ================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, arg = t.dataset.arg;

  if(act === 'mode'){
    state.mode = arg;
    state.route = {name: arg === 'funder' ? 'funder' : 'overview'};
    state.checkin = {open:false, step:0, draft:{}};
    closeDrawer(); render();
  }
  else if(act === 'go') go(arg);
  else if(act === 'drill') drill(arg);
  else if(act === 'closedrawer') closeDrawer();
  else if(act === 'theme'){
    const cur = document.documentElement.getAttribute('data-theme');
    const isDark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }
  else if(act === 'filter'){
    const [k, v] = arg.split(':');
    state.filters[k] = v; render();
  }
  else if(act === 'verify')  decide(arg, 'verified');
  else if(act === 'reject')  decide(arg, 'rejected');
  else if(act === 'more')    decide(arg, 'more');
  else if(act === 'actas'){ state.actingAs = arg; state.checkin = {open:false, step:0, draft:{}}; render(); }
  else if(act === 'checkin-start'){ state.checkin = {open:true, step:0, draft:{}}; render(); }
  else if(act === 'checkin-cancel'){ state.checkin = {open:false, step:0, draft:{}}; render(); }
  else if(act === 'ci-pick'){
    const i = arg.indexOf('::');
    state.checkin.draft[arg.slice(0, i)] = arg.slice(i + 2);
    render();
  }
  else if(act === 'checkin-back'){ state.checkin.step = Math.max(0, state.checkin.step - 1); render(); }
  else if(act === 'checkin-next'){
    const inp = document.querySelector('[data-k]');
    if(inp) state.checkin.draft[inp.dataset.k] = inp.value;
    if(state.checkin.step === CHECKIN_Q.length - 1) submitCheckin();
    else { state.checkin.step++; render(); }
  }
});
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

seedDemo();
render();
</script>
