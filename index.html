function vCohort(id){
  const c = sel.cohort(id);
  if(!c) return emptyState('Cohort not found','No cohort matches that identifier.');
  const tab = state.tab || 'overview';
  const tabs = ['overview','participants','products','outcomes','check-ins','evidence','stories'];
  const people = DB.enrolments.filter(e => e.cohortId === id).map(e => sel.participant(e.participantId));
  const prods = DB.products.filter(p => p.cohortId === id);
  const canon = c.canonical;

  const head = '<button class="kk-back" data-act="go" data-arg="cohorts">← Cohorts</button>' +
    '<h1 class="kk-h1">' + esc(c.name) + '</h1>' +
    '<p class="kk-lede">' + esc(c.note) + '</p>' +
    '<div class="kk-tabs" role="tablist">' + tabs.map(t =>
      '<button role="tab" aria-selected="' + (tab === t) + '" data-act="tab" data-arg="' + t + '">' +
      esc(t.charAt(0).toUpperCase() + t.slice(1).replace('-',' ')) + '</button>').join('') + '</div>';

  let body = '';
  if(tab === 'overview'){
    const notYet = '<span class="kk-gapcell">— Not yet measured</span>';
    body = '<div class="kk-grid four">' +
      '<div class="kk-panel"><div class="kk-sub">Participants</div><div class="kk-fig" style="font-size:24px">' + (canon.participants !== null ? fmt(canon.participants) : '—') + '</div><div class="kk-muted" style="font-size:12px">canonical</div></div>' +
      '<div class="kk-panel"><div class="kk-sub">Countries</div><div class="kk-fig" style="font-size:24px">' + (canon.countries.length || '—') + '</div><div class="kk-muted" style="font-size:12px">' + esc(canon.countries.join(', ') || 'not on record') + '</div></div>' +
      '<div class="kk-panel"><div class="kk-sub">Continents</div><div class="kk-fig" style="font-size:24px">' + (canon.continents !== null ? canon.continents : '—') + '</div></div>' +
      '<div class="kk-panel"><div class="kk-sub">Products shipped</div><div class="kk-fig" style="font-size:24px">' + (canon.productsShipped !== null ? canon.productsShipped : '—') + '</div><div class="kk-muted" style="font-size:12px">' + (canon.productsShipped !== null ? 'canonical' : 'not yet measured') + '</div></div>' +
      '</div>' +
      '<div class="kk-panel" style="margin-top:14px"><dl class="kk-kv">' +
        '<dt>Ran</dt><dd>' + (c.start ? dt(c.start) + ' – ' + dt(c.end) : '<span class="kk-gapcell">Not yet scheduled</span>') + '</dd>' +
        '<dt>Demo Day</dt><dd>' + (c.demoDay ? dt(c.demoDay) : '—') + '</dd>' +
        '<dt>Length</dt><dd>' + c.weeks + ' weeks' + (c.sessions ? ' · ' + c.sessions + ' live sessions' : '') + '</dd>' +
        '<dt>Records held</dt><dd>' + people.length + (canon.participants ? ' of ' + canon.participants : '') + '</dd>' +
        '<dt>Status</dt><dd>' + esc(c.status.toLowerCase()) + '</dd>' +
      '</dl></div>' +
      '<div style="margin-top:14px"><h2 class="kk-h2">Survival</h2>' +
      table(['30 days','90 days','180 days','365 days'], '<tr>' + [30,90,180,365].map(w => {
        const s = sel.survival(id, w);
        return '<td>' + (s.state === 'ok' ? '<b>' + s.pct + '%</b> <span class="kk-muted">(' + s.alive + '/' + s.base + ')</span>'
          : s.state === 'not_due' ? '<span class="kk-gapcell">Opens ' + dtShort(s.due) + '</span>' : notYet) + '</td>';
      }).join('') + '</tr>', {narrow:true}) + '</div>';
  }
  else if(tab === 'participants'){
    body = people.length ? table(['Builder','Country','Background','Completion','Products'], people.map(pa => {
      const e = sel.enrolmentOf(pa.id);
      return '<tr class="kk-rowlink" data-act="go" data-arg="builder:' + pa.id + '"><td>' + esc(participantName(pa)) + '</td>' +
        '<td class="kk-muted">' + (pa.country ? esc(pa.country) : '—') + '</td>' +
        '<td class="kk-muted">' + (pa.background ? esc(pa.background) : '—') + '</td>' +
        '<td class="kk-muted">' + esc(e.completionStatus.replace(/_/g,' ').toLowerCase()) + '</td>' +
        '<td class="num">' + sel.productsOf(pa.id).length + '</td></tr>';
    }).join('')) + '<p class="kk-sub" style="margin-top:12px">' + people.length + ' records held' +
      (canon.participants ? ' of ' + canon.participants + ' enrolled. ' + (canon.participants - people.length) + ' still to backfill.' : '.') + '</p>'
      : emptyState('No participant records','This cohort has not run, so nobody is enrolled yet.');
  }
  else if(tab === 'products'){
    body = prods.length ? table(['Product','Builder','Stage','Users','Revenue'], prods.map(p =>
      '<tr class="kk-rowlink" data-act="go" data-arg="product:' + p.id + '"><td>' + esc(productName(p)) + '</td>' +
      '<td class="kk-muted">' + esc(participantName(sel.participant(p.participantId))) + '</td>' +
      '<td>' + statusPill(sel.currentStatus(p.id)) + '</td>' +
      '<td class="num">' + mval(p.id,'TOTAL_USERS',{bare:true}) + '</td>' +
      '<td class="num">' + mval(p.id,'REVENUE',{bare:true}) + '</td></tr>').join(''))
      : emptyState('No products recorded','This cohort has not produced product records yet.');
  }
  else if(tab === 'outcomes'){
    const ids = new Set(people.map(p => p.id));
    const outs = DB.outcomes.filter(o => ids.has(o.participantId));
    body = outs.length ? table(['Builder','Outcome','Attribution','Strength'], outs.map(o =>
      '<tr><td>' + esc(participantName(sel.participant(o.participantId))) + '</td><td>' + esc(OUTCOME_META[o.type]) + '</td>' +
      '<td class="kk-muted">' + esc(ATTRIBUTION[o.attribution]) + '</td><td>' + vbadge(o.verification) + '</td></tr>').join(''))
      : emptyState('No outcomes recorded yet','No builder in this cohort has reported an outcome either way.');
  }
  else if(tab === 'check-ins'){
    const cks = DB.checkins.filter(x => x.cohortId === id);
    body = cks.length ? table(['Builder','Window','Due','Status'], cks.map(x =>
      '<tr class="kk-rowlink" data-act="checkin" data-arg="' + x.id + '"><td>' + esc(participantName(sel.participant(x.participantId))) + '</td>' +
      '<td>' + esc(x.type.replace('_',' ').toLowerCase()) + '</td><td class="kk-muted">' + dt(x.dueDate) + '</td>' +
      '<td>' + checkinBadge(x) + '</td></tr>').join(''))
      : emptyState('No check-in windows','Windows are created once a cohort reaches Demo Day.');
  }
  else if(tab === 'evidence'){
    const pids = new Set(prods.map(p => p.id));
    const evs = DB.evidence.filter(e => pids.has(e.productId));
    body = evs.length ? '<div class="kk-panel">' + evs.map(evRow).join('') + '</div>'
      : emptyState('No evidence submitted','Nothing has been submitted for this cohort yet.');
  }
  else {
    const ss = DB.stories.filter(s => prods.some(p => p.id === s.productId));
    body = ss.length ? '<div class="kk-gallery">' + ss.map(s =>
      '<button class="kk-card" data-act="go" data-arg="story:' + s.id + '"><h5>' + esc(s.title) + '</h5>' +
      '<p>' + esc(s.impactSummary) + '</p></button>').join('') + '</div>'
      : emptyState('No stories yet','No story has been written up for this cohort.');
  }
  return head + body;
}

function vCompare(){
  const cs = DB.cohorts.filter(c => c.canonical.participants !== null);
  const notYet = '<span class="kk-gapcell">— Not yet measured</span>';
  const rows = [
    ['Participants', c => fmt(c.canonical.participants)],
    ['Countries', c => c.canonical.countries.length ? fmt(c.canonical.countries.length) : null],
    ['Continents', c => c.canonical.continents !== null ? fmt(c.canonical.continents) : null],
    ['Ran', c => c.start ? dtShort(c.start) : null],
    ['Records held', c => fmt(DB.enrolments.filter(e => e.cohortId === c.id).length)],
    ['Products built', c => fmt(cohortCount(c.id,'BUILT'))],
    ['Products deployed', c => cohortCount(c.id,'DEPLOYED') ? fmt(cohortCount(c.id,'DEPLOYED')) : null],
    ['Products with users', c => cohortCount(c.id,'VALIDATED') ? fmt(cohortCount(c.id,'VALIDATED')) : null],
    ['Revenue-generating', c => cohortCount(c.id,'REVENUE') ? fmt(cohortCount(c.id,'REVENUE')) : null],
    ['Businesses formed', c => cohortCount(c.id,'BUSINESS') ? fmt(cohortCount(c.id,'BUSINESS')) : null],
    ['30-day survival', c => { const s = sel.survival(c.id,30); return s.state === 'ok' ? s.pct + '%' : null; }],
    ['90-day survival', c => { const s = sel.survival(c.id,90); return s.state === 'ok' ? s.pct + '%' : null; }]
  ].map(([lab, fn]) => '<tr><td>' + lab + '</td>' +
    cs.map(c => '<td class="num">' + (fn(c) === null ? notYet : fn(c)) + '</td>').join('') + '</tr>').join('');

  return '<button class="kk-back" data-act="go" data-arg="cohorts">← Cohorts</button>' +
    '<h1 class="kk-h1">Cohort comparison</h1>' +
    '<p class="kk-lede">Side by side, with no ranking. Cohorts run at different times and reach their measurement windows at different points, so a later cohort will always look thinner. That is a property of the calendar, not of the cohort.</p>' +
    table(['Metric'].concat(cs.map(c => c.name)), rows);
}

/* =========================================================================
   VIEW: CHECK-INS
========================================================================= */
function vCheckins(){
  const ids = new Set(sel.participants(state.filters).map(p => p.id));
  const all = DB.checkins.filter(c => ids.has(c.participantId));
  const windows = ['30_DAY','90_DAY','180_DAY','365_DAY'];
  const card = w => {
    const set = all.filter(c => c.type === w);
    const open = set.filter(c => c.status !== 'NOT_DUE');
    const done = set.filter(c => c.status === 'COMPLETED');
    return '<div class="kk-panel"><div class="kk-sub">' + w.replace('_',' ').toLowerCase() + ' completion</div>' +
      (open.length
        ? '<div class="kk-fig" style="font-size:24px">' + pctOf(done.length, open.length) + '%</div>' +
          bar(pctOf(done.length, open.length)) +
          '<div class="kk-muted" style="font-size:12.5px">' + done.length + ' of ' + open.length + ' returned</div>'
        : '<div class="kk-fig" data-c="0" style="font-size:24px">—</div>' +
          '<div class="kk-gapcell">Window has not opened</div>') + '</div>';
  };
  const bucket = s => all.filter(c => c.status === s);
  const rows = all.filter(c => c.status !== 'NOT_DUE')
    .sort((a,b) => a.dueDate.localeCompare(b.dueDate)).map(c => {
      const pa = sel.participant(c.participantId), p = c.productId ? sel.product(c.productId) : null;
      return '<tr class="kk-rowlink" data-act="checkin" data-arg="' + c.id + '">' +
        '<td><button class="kk-linkcell" data-act="go" data-arg="builder:' + c.participantId + '">' + esc(participantName(pa)) + '</button></td>' +
        '<td class="kk-muted">' + (p ? esc(productName(p)) : '<span class="kk-gapcell">No product recorded</span>') + '</td>' +
        '<td>' + esc(c.type.replace('_',' ').toLowerCase()) + '</td>' +
        '<td class="kk-muted">' + dt(c.dueDate) + '</td>' +
        '<td>' + checkinBadge(c) + '</td>' +
        '<td class="kk-muted">' + (c.completedDate ? dt(c.completedDate) : '—') + '</td></tr>';
    }).join('');

  return '<h1 class="kk-h1">Check-ins</h1>' +
    '<p class="kk-lede">Impact is collected in short passes after Demo Day rather than one long survey. A window that has not come round yet is pending, never a zero.</p>' +
    filterBar() + filterSummary() +
    '<div class="kk-grid four">' + windows.map(card).join('') + '</div>' +
    '<div class="kk-grid three" style="margin-top:14px">' +
      '<div class="kk-panel"><div class="kk-sub">Completed</div><div class="kk-fig" style="font-size:24px">' + bucket('COMPLETED').length + '</div></div>' +
      '<div class="kk-panel"><div class="kk-sub">Overdue</div><div class="kk-fig" style="font-size:24px">' + bucket('OVERDUE').length + '</div></div>' +
      '<div class="kk-panel"><div class="kk-sub">Not due yet</div><div class="kk-fig" style="font-size:24px">' + bucket('NOT_DUE').length + '</div></div>' +
    '</div>' +
    '<div style="margin-top:18px">' +
    table(['Builder','Product','Checkpoint','Due date','Status','Last response'], rows) + '</div>';
}

function checkinDetail(cid){
  const c = DB.checkins.find(x => x.id === cid);
  if(!c) return;
  const pa = sel.participant(c.participantId), p = c.productId ? sel.product(c.productId) : null;
  const row = (lab, val) => '<dt>' + esc(lab) + '</dt><dd>' + val + '</dd>';
  let body = '<dl class="kk-kv">' +
    row('Builder', '<button class="kk-linkcell" data-act="go" data-arg="builder:' + c.participantId + '">' + esc(participantName(pa)) + '</button>') +
    row('Product', p ? '<button class="kk-linkcell" data-act="go" data-arg="product:' + p.id + '">' + esc(productName(p)) + '</button>' : '<span class="kk-gapcell">No product recorded</span>') +
    row('Checkpoint', esc(c.type.replace('_',' ').toLowerCase())) +
    row('Due', dt(c.dueDate)) +
    row('Status', checkinBadge(c)) + '</dl>';

  if(c.status === 'COMPLETED' && p){
    body += '<h4 style="margin:18px 0 8px;font-family:var(--serif);font-weight:500">What they reported</h4><dl class="kk-kv">' +
      row('Product status', statusPill(sel.currentStatus(p.id))) +
      row('Users', mval(p.id,'TOTAL_USERS')) +
      row('Revenue', mval(p.id,'REVENUE')) +
      row('Builder outcome', (sel.outcomesOf(c.participantId)[0] || {}) .description
            ? esc(sel.outcomesOf(c.participantId)[0].description) : '<span class="kk-gapcell">Nothing reported</span>') +
      '</dl>';
  } else if(c.status === 'OVERDUE'){
    body += emptyState('No response yet',
      'This window closed on ' + dt(c.dueDate) + ' without a reply. Everything downstream of it for this builder is unknown rather than zero.') +
      '<button class="kk-btn sm" data-act="remind" data-arg="' + c.id + '" style="margin-top:10px">Send a reminder</button>';
  } else {
    body += emptyState('This window has not opened',
      'It opens on ' + dt(c.dueDate) + '. Nothing is missing yet.');
  }
  openDrawer('Check-in', esc(participantName(pa)) + ' · ' + esc(c.type.replace('_',' ').toLowerCase()), body);
}

/* =========================================================================
   VIEW: EVIDENCE
========================================================================= */
function vEvidence(){
  const tab = state.tab || 'queue';
  const pids = new Set(sel.products(state.filters).map(p => p.id));
  const all = DB.evidence.filter(e => pids.has(e.productId));
  const queue = all.filter(e => ['EVIDENCE_SUBMITTED','NEEDS_CLARIFICATION'].includes(e.verification));

  const head = '<h1 class="kk-h1">Evidence</h1>' +
    '<p class="kk-lede">Nothing a builder reports is treated as fact until someone here looks at it. Accepting a claim raises its strength everywhere it appears, including the funder view.</p>' +
    filterBar() +
    '<div class="kk-tabs" role="tablist">' +
      '<button role="tab" aria-selected="' + (tab === 'queue') + '" data-act="tab" data-arg="queue">Verification queue' +
        (queue.length ? ' <span class="kk-fcount">' + queue.length + '</span>' : '') + '</button>' +
      '<button role="tab" aria-selected="' + (tab === 'library') + '" data-act="tab" data-arg="library">Evidence library</button>' +
      '<button role="tab" aria-selected="' + (tab === 'method') + '" data-act="tab" data-arg="method">How numbers are checked</button>' +
    '</div>';

  if(tab === 'method'){
    return head + '<div class="kk-panel">' + confLegend() + '</div>' +
      '<p class="kk-sub" style="margin-top:14px">A claim is never silently promoted to a verified fact. A rejected item leaves the underlying claim standing at its previous strength rather than deleting it.</p>';
  }
  if(tab === 'library'){
    return head + (all.length ? table(['Evidence','Product','Type','Submitted','Status'], all.map(e =>
      '<tr class="kk-rowlink" data-act="claim" data-arg="' + e.id + '"><td>' + esc(e.title) + '</td>' +
      '<td><button class="kk-linkcell" data-act="go" data-arg="product:' + e.productId + '">' + esc(productName(sel.product(e.productId))) + '</button></td>' +
      '<td class="kk-muted">' + esc(e.type.replace(/_/g,' ').toLowerCase()) + '</td>' +
      '<td class="kk-muted">' + dt(e.submittedAt) + '</td><td>' + vbadge(e.verification) + '</td></tr>').join(''))
      : emptyState('No evidence in scope','No evidence has been submitted for the products matching these filters.'));
  }
  return head + (queue.length
    ? queue.map(e => {
        const p = sel.product(e.productId);
        return '<div class="kk-panel" style="margin-bottom:12px">' +

// Simulated review. Changing evidence changes every metric that cites it.
function applyVerdict(arg){
  const [eid, verdict] = arg.split('::');
  const e = sel.evidenceById(eid);
  if(!e) return;
  e.verification = verdict;
  e.verifiedAt = TODAY;
  if(verdict === 'KAYKAV_VERIFIED'){
    DB.metrics.filter(m => m.evidenceId === eid).forEach(m => { m.verification = 'KAYKAV_VERIFIED'; });
    toast('Accepted. Every figure citing this evidence now reads as verified.');
  } else if(verdict === 'REJECTED'){
    DB.metrics.filter(m => m.evidenceId === eid).forEach(m => { m.verification = 'SELF_REPORTED'; });
    toast('Rejected. The claim stands, at self-reported strength.');
  } else {
    toast('Clarification requested. The claim is held at its current strength.');
  }
  closeDrawer(); render();
}

// questions that apply given the answers so far
function ciSteps(){
  const d = state.checkin.draft;
  return CHECKIN_Q.filter(q => !q.when || q.when(d));
}

// Text and number answers live in the DOM until navigation, so read them first.
function ciCapture(){
  const el = document.querySelector('[data-k]');
  if(!el) return;
  const k = el.dataset.k, raw = el.value.trim();
  if(raw === '') delete state.checkin.draft[k];
  else state.checkin.draft[k] = el.type === 'number' ? Number(raw) : raw;
}

function vCheckinForm(){
  const steps = ciSteps(), i = Math.min(state.checkin.step, steps.length - 1), q = steps[i];
  const d = state.checkin.draft;
  const val = d[q.k];

  let field = '';
  if(q.type === 'choice'){
    field = '<div class="kk-radios" role="group" aria-label="' + esc(q.q) + '">' + q.options.map(o =>
      '<button class="kk-radio" data-act="ci-pick" data-arg="' + esc(q.k) + '::' + esc(o) + '" aria-pressed="' +
      (val === o) + '">' + esc(o) + '</button>').join('') + '</div>';
  } else if(q.type === 'number'){
    field = '<input class="kk-input" type="number" min="0" inputmode="numeric" data-k="' + esc(q.k) + '" ' +
      'value="' + (val === undefined || val === null ? '' : esc(val)) + '" placeholder="e.g. 120" ' +
      'aria-label="' + esc(q.q) + '" style="max-width:220px">';
  } else {
    field = '<textarea class="kk-textarea" data-k="' + esc(q.k) + '" aria-label="' + esc(q.q) + '" ' +
      'placeholder="Type your answer">' + esc(val || '') + '</textarea>';
  }

  const answered = q.type === 'choice' ? val !== undefined : true;
  const last = i === steps.length - 1;

  return '<div style="max-width:620px;margin:0 auto">' +
    '<button class="kk-back" data-act="checkin-cancel">← Leave the check-in</button>' +
    '<div class="kk-prog"><div class="kk-progtrack"><i style="width:' +
      Math.round((i / steps.length) * 100) + '%"></i></div>' +
      '<span class="kk-progstep">Question ' + (i + 1) + ' of ' + steps.length + '</span></div>' +
    '<h1 class="kk-qtext">' + esc(q.q) + '</h1>' +
    '<p class="kk-qhelp">' + esc(q.help) + '</p>' +
    field +
    '<div class="kk-ciact">' +
      (i > 0 ? '<button class="kk-btn ghost" data-act="checkin-back">Back</button>' : '') +
      '<span class="spacer"></span>' +
      (q.skippable ? '<button class="kk-btn ghost" data-act="checkin-skip">I don’t know</button>' : '') +
      '<button class="kk-btn" data-act="checkin-next"' + (answered ? '' : ' disabled') + '>' +
        (last ? 'Review' : 'Next') + '</button>' +
    '</div></div>';
}

/* What the answers will actually write. Shown before submit so the builder
   can see exactly what is recorded and at what strength. */
function ciPlan(){
  const d = state.checkin.draft, pa = sel.participant(state.actingAs);
  const p = sel.productsOf(pa.id)[0] || null;
  const hasEvidence = d.evidence && d.evidence !== 'Nothing to attach';
  const strength = hasEvidence ? 'EVIDENCE_SUBMITTED' : 'SELF_REPORTED';
  const rows = [];

  if(d._noProduct && d.hasProduct === 'Yes' && d.productName)
    rows.push({k:'New product record', v:esc(d.productName), n:'Opened at "Built"'});
  if(d.status){
    const target = STATUS_FROM_LABEL[d.status];
    const cur = p ? sel.currentStatus(p.id) : null;
    const isOff = OFF_STATUS.includes(target);
    const advances = p && STATUS_META[target].n !== null &&
                     STATUS_META[target].n > sel.peakRank(p.id);
    rows.push({k:'Product status', v:STATUS_META[target].label,
      n:!p ? 'Recorded on the new product record'
        : target === cur ? 'Unchanged — no new history entry'
        : (isOff || advances) ? 'Added to the status history'
        : 'Noted, but not written back — a self-report does not move a product down the ladder'});
  }
  const numRow = (label, key, type) => {
    if(d[key] === undefined) return rows.push({k:label, v:'—', n:'Skipped — recorded as unknown, not zero'});
    rows.push({k:label, v:(type === 'REVENUE' ? money(d[key]) : fmt(d[key])),
      n:'Recorded as ' + VERIF[strength].label.toLowerCase() +
        (d[key] === 0 ? ' · a measured zero, which is different from unknown' : '')});
  };
  if(d.status){ numRow('Total users','users','TOTAL_USERS'); numRow('Active in last 30 days','mau','MONTHLY_ACTIVE_USERS'); }
  if(d.paid && d.paid !== 'No') numRow('Revenue','revenue','REVENUE');
  else if(d.paid === 'No') rows.push({k:'Revenue', v:'None', n:'Recorded as a confirmed zero, not a gap'});

  if(d.outcome === 'Yes')
    rows.push({k:'Builder outcome', v:esc(d.outcomeType || 'Other outcome'),
      n:'Recorded as self-reported, attribution "participant-reported association"'});
  else if(d.outcome === 'No')
    rows.push({k:'Builder outcome', v:'None reported',
      n:'Recorded explicitly, so the absence is visible rather than missing'});

  if(hasEvidence)
    rows.push({k:'Evidence', v:esc(d.evidence),
      n:d.evidence === 'Connect my analytics'
        ? 'Logged as a connection request, held for clarification'
        : 'Added to the verification queue for a reviewer'});
  return rows;
}

function vCheckinReview(){
  const rows = ciPlan();
  return '<div style="max-width:620px;margin:0 auto">' +
    '<button class="kk-back" data-act="checkin-back">← Back to the questions</button>' +
    '<h1 class="kk-h1">Before you send it</h1>' +
    '<p class="kk-lede">This is exactly what gets recorded, and how strongly each figure will be held. Nothing here becomes a fact until someone checks the evidence.</p>' +
    '<div class="kk-panel"><ul class="kk-writes">' + rows.map(r =>
      '<li><span class="wk">' + r.k + '</span><span class="wv">' + r.v + '</span>' +
      '<span class="wn">' + r.n + '</span></li>').join('') + '</ul></div>' +
    '<div class="kk-ciact"><span class="spacer"></span>' +
      '<button class="kk-btn gold" data-act="checkin-submit">Send my check-in</button></div></div>';
}

function vCheckinDone(){
  const pa = sel.participant(state.actingAs);
  const written = state.checkin.written || [];
  return '<div style="max-width:620px;margin:0 auto">' +
    '<h1 class="kk-h1">Thank you</h1>' +
    '<p class="kk-lede">Your check-in is recorded. Here is what changed in the platform because of it.</p>' +
    '<div class="kk-panel"><ul class="kk-writes">' + written.map(w =>
      '<li><span class="wk">' + w.k + '</span><span class="wv">' + w.v + '</span>' +
      (w.n ? '<span class="wn">' + w.n + '</span>' : '') + '</li>').join('') + '</ul></div>' +
    '<p class="kk-sub" style="margin-top:14px">Anything you skipped stays recorded as unknown. We would rather have a gap than a guess.</p>' +
    '<div class="kk-ciact"><button class="kk-btn ghost" data-act="checkin-cancel">Back to my products</button></div></div>';
}

/* Writes the answers into the normalised entities. This is the platform's
   only participant-facing write path. */
function submitCheckin(){
  const d = state.checkin.draft;
  const pa = sel.participant(state.actingAs);
  const ck = byId(DB.checkins, state.checkin.checkinId);
  const hasEvidence = d.evidence && d.evidence !== 'Nothing to attach';
  const strength = hasEvidence ? 'EVIDENCE_SUBMITTED' : 'SELF_REPORTED';
  const written = [];
  let p = sel.productsOf(pa.id)[0] || null;
  let evId = null;

  // a product record, if they built something we did not know about
  if(!p && d.hasProduct === 'Yes' && d.productName){
    p = {id:'pr' + (DB.products.length + 1) + 'n', participantId:pa.id,
         cohortId:(sel.enrolmentOf(pa.id)||{}).cohortId, programmeId:'bnp',
         name:d.productName, aka:null, category:'Other', domain:null, liveUrl:null,
         dataMode:'demo', description:'Entered by the builder at a check-in.', problem:null};
    DB.products.push(p);
    DB.statusHistory.push({productId:p.id, status:'BUILT', effectiveDate:TODAY, source:'IMPACT_CHECKIN'});
    written.push({k:'New product record', v:esc(p.name), n:'Opened at "Built"'});
  }

  // evidence first, so metrics can cite it
  if(hasEvidence && p){
    evId = 'ev' + (DB.evidence.length + 1) + 'n';
    const connect = d.evidence === 'Connect my analytics';
    DB.evidence.push({id:evId, participantId:pa.id, productId:p.id,
      type:connect ? 'ANALYTICS_CONNECTION' : d.evidence === 'Payment provider export' ? 'PAYMENT_PROVIDER'
           : d.evidence === 'A customer we can contact' ? 'CUSTOMER_TESTIMONIAL' : 'ANALYTICS_SCREENSHOT',
      title:d.evidence, description:'Offered by the builder at the ' +
        ck.type.replace('_',' ').toLowerCase() + ' check-in.',
      submittedAt:TODAY, verification:connect ? 'NEEDS_CLARIFICATION' : 'EVIDENCE_SUBMITTED',
      verifiedAt:null, reviewNote:connect ? 'Connection requested; not yet established.' : null});
    written.push({k:'Evidence', v:esc(d.evidence),
      n:connect ? 'Held pending connection' : 'Queued for a reviewer'});
  }

  if(p){
    // status — an explicit stop is always written; a self-report never demotes
    const target = STATUS_FROM_LABEL[d.status];
    if(target){
      const cur = sel.currentStatus(p.id);
      const isOff = OFF_STATUS.includes(target);
      const advances = STATUS_META[target].n !== null && STATUS_META[target].n > sel.peakRank(p.id);
      if(target !== cur && (isOff || advances)){
        DB.statusHistory.push({productId:p.id, status:target, effectiveDate:TODAY,
          source:'IMPACT_CHECKIN', evidenceId:evId,
          notes:'Reported by the builder as "' + d.status + '".'});
        written.push({k:'Product status', v:STATUS_META[target].label, n:'Added to the status history'});
      } else {
        written.push({k:'Product status', v:STATUS_META[target].label, n:'No change to the record'});
      }
    }
    // metrics — a skipped answer writes nothing at all
    const push = (type, value, label) => {
      if(value === undefined || value === null) {
        written.push({k:label, v:'—', n:'Left unknown'});
        return;
      }
      DB.metrics.push(met(p.id, type, value, TODAY, 'IMPACT_CHECKIN', strength, evId));
      written.push({k:label, v:type === 'REVENUE' ? money(value) : fmt(value),
        n:'Recorded as ' + VERIF[strength].label.toLowerCase()});
    };
    push('TOTAL_USERS', d.users, 'Total users');
    push('MONTHLY_ACTIVE_USERS', d.mau, 'Active in last 30 days');
    if(d.paid && d.paid !== 'No') push('REVENUE', d.revenue, 'Revenue');
    else if(d.paid === 'No'){
      DB.metrics.push(met(p.id, 'REVENUE', 0, TODAY, 'IMPACT_CHECKIN', 'SELF_REPORTED', null));
      written.push({k:'Revenue', v:'$0', n:'A confirmed zero, not a gap'});
    }
  }

  // builder outcome, recorded either way
  if(d.outcome === 'Yes'){
    DB.outcomes.push({id:'o' + (DB.outcomes.length + 1) + 'n', participantId:pa.id,
      type:OUTCOME_FROM_LABEL[d.outcomeType] || 'OTHER', date:TODAY,
      description:d.outcomeHow || d.outcomeType || 'Reported at a check-in.',
      financialValue:null, currency:null, attribution:'ASSOCIATED',
      verification:'SELF_REPORTED', evidenceId:null});
    written.push({k:'Builder outcome', v:esc(d.outcomeType || 'Other outcome'), n:'Recorded as self-reported'});
  } else if(d.outcome === 'No'){
    DB.outcomes.push({id:'o' + (DB.outcomes.length + 1) + 'n', participantId:pa.id,
      type:'NO_OUTCOME', date:TODAY, description:'Reported no change to work or income at the ' +
        ck.type.replace('_',' ').toLowerCase() + ' check-in.',
      financialValue:null, currency:null, attribution:'UNKNOWN',
      verification:'SELF_REPORTED', evidenceId:null});
    written.push({k:'Builder outcome', v:'None reported', n:'Recorded so the absence is visible'});
  }

  // close the window
  ck.status = 'COMPLETED';
  ck.completedDate = TODAY;
  ck.responses = Object.assign({}, d);
  if(!ck.productId && p) ck.productId = p.id;
  written.push({k:'Check-in', v:ck.type.replace('_',' ').toLowerCase(), n:'Marked complete on ' + dt(TODAY)});

  state.checkin = {open:true, step:0, draft:{}, done:true, written};
  toast('Check-in received. Thank you.');
  render();
}

function vBuilderHome(){
  // the wizard takes over the whole builder surface while it is open
  if(state.checkin.done) return vCheckinDone();
  if(state.checkin.open){
    return state.checkin.step >= ciSteps().length ? vCheckinReview() : vCheckinForm();
  }
  const pa = sel.participant(state.actingAs);
  const ps = sel.productsOf(pa.id);
  const open = sel.openCheckin(pa.id);
  const done = sel.checkinsOf(pa.id).filter(c => c.status === 'COMPLETED');
  const peers = DB.enrolments.filter(e => e.cohortId === (sel.enrolmentOf(pa.id) || {}).cohortId)
                  .map(e => sel.participant(e.participantId));
  return '<div style="max-width:660px;margin:0 auto">' +
    '<div class="kk-chips"><div class="kk-chipgroup"><span>Signed in as</span>' +
      peers.map(o => '<button class="kk-chip" data-act="actas" data-arg="' + o.id + '" aria-pressed="' +
        (o.id === state.actingAs) + '">' + esc(participantName(o)) + '</button>').join('') + '</div></div>' +
    '<h1 class="kk-h1">Hello ' + esc(participantName(pa)) + '</h1>' +
    '<p class="kk-lede">We ask four short times after Demo Day: at 30 days, 90 days, six months and a year. It takes about two minutes.</p>' +
    (ps.length ? ps.map(p => '<div class="kk-panel" style="margin-bottom:12px">' +
      '<h2 class="kk-h2">' + esc(productName(p)) + '</h2>' +
      '<p class="kk-sub">' + esc(p.description || '') + '</p>' +
      '<div style="margin-top:8px">' + statusPill(sel.currentStatus(p.id)) + '</div></div>').join('')
      : emptyState('Nothing on record yet','Your check-in will open the first record for you.')) +
    (open
      ? '<div class="kk-panel"><h2 class="kk-h2">Your ' + esc(open.type.replace('_',' ').toLowerCase()) + ' check-in</h2>' +
        '<p class="kk-sub">It was due on ' + dt(open.dueDate) + '. A handful of questions, about two minutes, ' +
        'and you can skip anything you do not know.</p>' +
        '<button class="kk-btn gold" data-act="checkin-start" data-arg="' + open.id + '">Start the check-in</button></div>'
      : '<div class="kk-panel"><h2 class="kk-h2">Nothing due right now</h2>' +
        '<p class="kk-sub">' + (done.length
          ? 'Your last one came in on ' + dt(done[done.length - 1].completedDate) + '. We will email you when the next window opens.'
          : 'Your first window opens 30 days after Demo Day.') + '</p></div>') +
    (done.length ? '<div class="kk-panel" style="margin-top:12px"><h2 class="kk-h2">What you have told us</h2>' +
      timelineHTML(done.map(c => ({d:c.completedDate,
        t:'Returned the ' + c.type.replace('_',' ').toLowerCase() + ' check-in',
        s:c.responses ? 'Status reported as \u201c' + (c.responses.status || '\u2014') + '\u201d' : 'Impact check-in'}))) +
      '</div>' : '') +
    '</div>';
}

/* =========================================================================
   ROUTER
   Old v1 route names are aliased so anything previously linked still lands.
========================================================================= */
const ROUTE_ALIAS = {verify:'evidence', gaps:'data-quality', trust:'evidence', dictionary:'data-quality', products:'products'};
const VIEWS = {
  overview:vOverview, builders:vBuilders, products:vProducts, outcomes:vOutcomes,
  cohorts:vCohorts, compare:vCompare, checkins:vCheckins, evidence:vEvidence,
  stories:vStories, reports:vReports, 'data-quality':vDataQuality
};
// which sections each mode is allowed to reach
const ALLOWED = {
  internal:Object.keys(VIEWS),
  funder:['overview','outcomes','cohorts','compare','stories','reports']
};

function render(){
  const r = state.route;
  let inner = '';

  if(state.mode === 'public')       inner = vPublic();
  else if(state.mode === 'builder') inner = vBuilderHome();
  else if(r.name === 'product')     inner = vProduct(r.id);
  else if(r.name === 'builder')     inner = vBuilder(r.id);
  else if(r.name === 'cohort')      inner = vCohort(r.id);
  else if(r.name === 'story')       inner = vStory(r.id);
  else {
    const name = ROUTE_ALIAS[r.name] || r.name;
    const allowed = ALLOWED[state.mode] || [];
    const fn = allowed.includes(name) ? VIEWS[name] : null;
    inner = fn ? fn() : (state.mode === 'funder' ? vFunderOverview() : vOverview());
    if(state.mode === 'funder' && name === 'overview') inner = vFunderOverview();
  }

  $('#app').innerHTML = shell(inner);
  window.scrollTo({top:0});
}

function go(arg){
  const [name, id] = arg.split(':');
  const canonical = ROUTE_ALIAS[name] || name;
  // moving to a different section clears the sub-tab and sort
  if(canonical !== state.route.name){ state.tab = null; state.sort = {key:null, dir:1}; }
  if(name === 'trust') state.tab = 'method';
  state.route = {name:canonical, id:id || null};
  state.query = '';
  closeDrawer();
  render();
}

/* =========================================================================
   EVENTS  (one delegated listener; survives every re-render)
========================================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, arg = t.dataset.arg;

  if(act === 'go') go(arg);
  else if(act === 'mode'){
    state.mode = arg;
    state.route = {name:'overview', id:null};
    state.tab = null; state.query = '';
    closeDrawer(); render();
  }
  else if(act === 'tab'){ state.tab = arg; render(); }
  else if(act === 'sort'){
    state.sort = state.sort.key === arg ? {key:arg, dir:-state.sort.dir} : {key:arg, dir:1};
    render();
  }
  else if(act === 'funnel'){
    // a funnel node is a filtered view of the product observatory
    state.filters.status = arg === 'all' ? 'all' : arg;
    state.tab = null;
    state.route = {name:'products', id:null};
    render();
  }
  else if(act === 'resetfilters'){
    state.filters = {programme:'all', cohort:'all', period:'all', verification:'all', domain:'all', status:'all'};
    render();
  }
  else if(act === 'checkin-start'){
    const pa = sel.participant(state.actingAs);
    state.checkin = {open:true, step:0, checkinId:arg, done:false,
                     draft:{_noProduct: sel.productsOf(pa.id).length === 0}};
    render();
  }
  else if(act === 'ci-pick'){
    const i = arg.indexOf('::');
    state.checkin.draft[arg.slice(0, i)] = arg.slice(i + 2);
    render();
  }
  else if(act === 'checkin-next'){
    ciCapture();
    state.checkin.step++;
    render();
  }
  else if(act === 'checkin-skip'){
    const q = ciSteps()[state.checkin.step];
    if(q) delete state.checkin.draft[q.k];
    state.checkin.step++;
    render();
  }
  else if(act === 'checkin-back'){
    ciCapture();
    const steps = ciSteps();
    state.checkin.step = state.checkin.step >= steps.length
      ? steps.length - 1 : Math.max(0, state.checkin.step - 1);
    render();
  }
  else if(act === 'checkin-cancel'){ state.checkin = {open:false, step:0, draft:{}}; render(); }
  else if(act === 'checkin-submit') submitCheckin();
  else if(act === 'timeline'){
    const pa = sel.participant(arg), tl = builderTimeline(arg);
    openDrawer('Timeline', esc(participantName(pa)) + ' \u00b7 ' + tl.length + ' events, oldest first',
      timelineHTML(tl));
  }
  else if(act === 'checkin') checkinDetail(arg);
  else if(act === 'claim')   claimDetail(arg);
  else if(act === 'verdict') applyVerdict(arg);
  else if(act === 'remind'){ toast('Reminder sent. This is simulated in the prototype.'); closeDrawer(); }
  else if(act === 'toast')   toast(arg);
  else if(act === 'actas'){  state.actingAs = arg; render(); }
  else if(act === 'closedrawer') closeDrawer();
  else if(act === 'theme'){
    const cur = document.documentElement.getAttribute('data-theme');
    const isDark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }
});

// filter selects
document.addEventListener('change', e => {
  const s = e.target.closest('[data-filter]');
  if(!s) return;
  state.filters[s.dataset.filter] = s.value;
  render();
});

// global search
let searchT;
document.addEventListener('input', e => {
  const i = e.target.closest('[data-act="search"]');
  if(!i) return;
  state.query = i.value;
  clearTimeout(searchT);
  searchT = setTimeout(() => {
    render();
    const box = document.querySelector('.kk-search input');
    if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }, 160);
});

$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

render();

</script>
