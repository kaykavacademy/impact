<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A prototype of KayKav's impact measurement system: what builders create after the programme, and what becomes of it.">
<meta property="og:title" content="KayKav Builder Impact">
<meta property="og:description" content="Prototype — illustrative data. Every figure shows the strength of its evidence.">
<meta property="og:type" content="website">
<title>KayKav Builder Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202F; --ink2:#42536A; --ink3:#6E7F94;
  --paper:#EDF0F4; --surface:#FFFFFF; --surface2:#F7F9FB;
  --rule:#D5DCE5; --rule2:#E6EBF1;
  --blue:#295898; --blue-ink:#1D4275; --blue-tint:#E6EDF6;
  --gold:#B18C54; --gold-tint:#F4ECDE;
  --c0:#93A1B1; --c1:#7E9CC6; --c2:#295898; --c3:#B18C54;
  --c0-tint:#EAEDF1; --c1-tint:#E6EDF6; --c2-tint:#DCE6F3; --c3-tint:#F4ECDE;
  --shadow:0 1px 2px rgba(20,32,47,.06), 0 8px 24px -16px rgba(20,32,47,.28);
  --sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --serif:'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EDF4; --ink2:#A9B8CA; --ink3:#7F90A5;
    --paper:#0E151E; --surface:#161F2B; --surface2:#1B2633;
    --rule:#2B3747; --rule2:#232E3C;
    --blue:#7BA5DC; --blue-ink:#A6C4EB; --blue-tint:#1B2B3F;
    --gold:#D3AF7B; --gold-tint:#2B2318;
    --c0:#7C8B9C; --c1:#6E92C4; --c2:#7BA5DC; --c3:#D3AF7B;
    --c0-tint:#212B37; --c1-tint:#1B2B3F; --c2-tint:#1B2B3F; --c3-tint:#2B2318;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EDF4; --ink2:#A9B8CA; --ink3:#7F90A5;
  --paper:#0E151E; --surface:#161F2B; --surface2:#1B2633;
  --rule:#2B3747; --rule2:#232E3C;
  --blue:#7BA5DC; --blue-ink:#A6C4EB; --blue-tint:#1B2B3F;
  --gold:#D3AF7B; --gold-tint:#2B2318;
  --c0:#7C8B9C; --c1:#6E92C4; --c2:#7BA5DC; --c3:#D3AF7B;
  --c0-tint:#212B37; --c1-tint:#1B2B3F; --c2-tint:#1B2B3F; --c3-tint:#2B2318;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--blue-ink)}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.kk-top{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:10px 20px; background:var(--surface);
  border-bottom:1px solid var(--rule);
}
.kk-wordmark{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.kk-wordmark b{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.015em}
.kk-wordmark span{font-size:12.5px;color:var(--ink3)}
.kk-demo{
  font-size:11.5px; color:var(--gold); border:1px dashed var(--gold);
  padding:2px 8px; border-radius:999px; background:var(--gold-tint); white-space:nowrap;
}
.kk-modes{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--rule);border-radius:999px;padding:3px}
.kk-modes button{padding:5px 13px;border-radius:999px;font-size:13px;color:var(--ink2)}
.kk-modes button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:500}
.kk-theme{width:32px;height:32px;border:1px solid var(--rule);border-radius:8px;display:grid;place-items:center;color:var(--ink3)}

.kk-body{display:flex;min-height:calc(100vh - 53px);align-items:stretch}
.kk-rail{
  flex:0 0 218px; background:var(--surface); border-right:1px solid var(--rule);
  padding:18px 12px 40px; position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;
}
.kk-rail h6{margin:16px 8px 6px;font-size:11.5px;font-weight:500;color:var(--ink3);letter-spacing:.01em}
.kk-rail h6:first-child{margin-top:0}
.kk-navitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 9px;border-radius:7px;font-size:14px;color:var(--ink2);
}
.kk-navitem:hover{background:var(--surface2)}
.kk-navitem[aria-current="page"]{background:var(--blue-tint);color:var(--blue-ink);font-weight:500}
.kk-navitem .kk-count{margin-left:auto;font-size:11.5px;font-variant-numeric:tabular-nums;
  background:var(--gold);color:#fff;border-radius:999px;padding:1px 7px;font-weight:500}
.kk-main{flex:1;min-width:0;padding:30px 34px 90px;max-width:1180px}

@media (max-width:860px){
  .kk-body{display:block}
  .kk-rail{position:static;height:auto;width:100%;flex:none;display:flex;gap:6px;overflow-x:auto;
    padding:10px 14px;border-right:none;border-bottom:1px solid var(--rule)}
  .kk-rail h6{display:none}
  .kk-navitem{width:auto;white-space:nowrap;padding:6px 11px}
  .kk-main{padding:22px 16px 80px}
  .kk-wordmark span{display:none}
}

/* ---------- headings ---------- */
.kk-h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,34px);line-height:1.15;
  letter-spacing:-.018em;margin:0 0 6px}
.kk-lede{color:var(--ink2);margin:0 0 26px;max-width:62ch;font-size:15px}
.kk-h2{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em;margin:0 0 3px}
.kk-sub{color:var(--ink3);font-size:13px;margin:0 0 14px;max-width:70ch}
.kk-section{margin:38px 0 0}
.kk-section:first-of-type{margin-top:0}

/* ---------- surfaces ---------- */
.kk-panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
.kk-panel + .kk-panel{margin-top:14px}
.kk-grid{display:grid;gap:14px}
.kk-grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kk-grid.three{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}

/* ---------- confidence meter ---------- */
.kk-conf{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.kk-conf-bars{display:inline-flex;gap:2px}
.kk-conf-bars i{width:5px;height:11px;border-radius:1.5px;background:var(--rule);display:block}
.kk-conf[data-c="0"] i.on{background:var(--c0)}
.kk-conf[data-c="1"] i.on{background:var(--c1)}
.kk-conf[data-c="2"] i.on{background:var(--c2)}
.kk-conf[data-c="3"] i.on{background:var(--c3)}
.kk-conf small{font-size:11.5px;color:var(--ink3)}
.kk-conf[data-c="3"] small{color:var(--gold)}
.kk-conf[data-c="2"] small{color:var(--blue-ink)}

/* figures dim as confidence drops — the core visual rule */
.kk-fig{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.kk-fig[data-c="0"]{color:var(--ink3);font-weight:300}
.kk-fig[data-c="1"]{color:var(--ink2);font-weight:400}
.kk-fig[data-c="2"]{color:var(--ink);font-weight:500}
.kk-fig[data-c="3"]{color:var(--ink);font-weight:600}
.kk-fig.unknown{color:var(--ink3);font-weight:300;font-style:italic;font-size:.62em;letter-spacing:0}

.kk-metric{display:flex;flex-direction:column;gap:7px}
.kk-metric .kk-fig{font-size:clamp(28px,3.6vw,38px)}
.kk-metric .kk-fig.unknown{font-size:17px}
.kk-metric .kk-lab{font-size:13px;color:var(--ink2)}
.kk-metric .kk-note{font-size:11.5px;color:var(--ink3)}
button.kk-metric{text-align:left;align-items:flex-start;width:100%;
  border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:16px 17px}
button.kk-metric:hover{border-color:var(--blue);background:var(--surface2)}

/* ---------- funnel ---------- */
.kk-funnel{display:flex;flex-direction:column;gap:3px}
.kk-frow{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:14px;align-items:center;
  width:100%;text-align:left;padding:5px 6px;border-radius:7px}
.kk-frow:hover{background:var(--surface2)}
.kk-frow .kk-flab{font-size:13.5px;color:var(--ink2)}
.kk-frow .kk-flab em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3)}
.kk-ftrack{display:flex;align-items:center;gap:10px;min-width:0}
.kk-fbar{height:26px;border-radius:3px;background:var(--blue-tint);display:flex;overflow:hidden;
  min-width:3px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.kk-fbar i{display:block;height:100%;background:var(--blue);transition:width .5s}
.kk-fbar.gold{background:var(--gold-tint)}
.kk-fbar.gold i{background:var(--gold)}
.kk-fcount{font-family:var(--serif);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- ladder ---------- */
.kk-pips{display:inline-flex;gap:2px}
.kk-pips i{width:7px;height:7px;border-radius:2px;background:var(--rule2);display:block}
.kk-pips i.on{background:var(--blue)}
.kk-pips i.on.gold{background:var(--gold)}
.kk-ladder{display:flex;flex-direction:column;gap:0;margin:4px 0 0}
.kk-step{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid var(--rule2)}
.kk-step:last-child{border-bottom:none}
.kk-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--rule);margin-top:3px;background:var(--surface)}
.kk-step.done .kk-dot{background:var(--blue);border-color:var(--blue)}
.kk-step.done.gold .kk-dot{background:var(--gold);border-color:var(--gold)}
.kk-step.now .kk-dot{box-shadow:0 0 0 4px var(--blue-tint)}
.kk-step .kk-sname{font-size:14px;font-weight:500}
.kk-step.todo .kk-sname{color:var(--ink3);font-weight:400}
.kk-step .kk-sdesc{font-size:12.5px;color:var(--ink3);margin-top:1px}
.kk-step .kk-sdate{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- tables ---------- */
.kk-tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table.kk-table{border-collapse:collapse;width:100%;min-width:660px;font-size:13.5px}
.kk-table th{
  text-align:left;font-weight:500;font-size:12px;color:var(--ink3);
  padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface2);white-space:nowrap;
}
.kk-table td{padding:11px 14px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.kk-table tr:last-child td{border-bottom:none}
.kk-table tbody tr:hover{background:var(--surface2)}
.kk-rowlink{cursor:pointer}
.kk-rowlink:hover,.kk-rowlink:focus-within{background:var(--surface2)}
.kk-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kk-linkcell{font-weight:500;color:var(--blue-ink);text-align:left}
.kk-linkcell:hover{text-decoration:underline}
.kk-muted{color:var(--ink3)}
.kk-gapcell{color:var(--ink3);font-style:italic;font-size:12.5px}

/* ---------- pills / chips ---------- */
.kk-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;
  border-radius:999px;background:var(--surface2);border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.kk-pill.blue{background:var(--blue-tint);border-color:transparent;color:var(--blue-ink)}
.kk-pill.gold{background:var(--gold-tint);border-color:transparent;color:var(--gold)}
.kk-pill.gap{border-style:dashed;color:var(--ink3);background:transparent}
.kk-chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.kk-chip{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink2)}
.kk-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kk-chipgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.kk-chipgroup > span{font-size:12px;color:var(--ink3);margin-right:1px}

/* ---------- buttons ---------- */
.kk-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;
  background:var(--blue);color:#fff;font-size:13.5px;font-weight:500}
.kk-btn:hover{background:var(--blue-ink)}
.kk-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--rule)}
.kk-btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.kk-btn.gold{background:var(--gold)}
.kk-btn.sm{padding:5px 11px;font-size:12.5px}
.kk-btn:disabled{opacity:.45;cursor:not-allowed}
.kk-back{font-size:13px;color:var(--ink3);margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}
.kk-back:hover{color:var(--blue-ink)}

/* ---------- forms ---------- */
.kk-field{margin:0 0 18px}
.kk-field label{display:block;font-size:14px;font-weight:500;margin-bottom:3px}
.kk-field .kk-help{font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.kk-input, .kk-select, .kk-textarea{
  width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px
}
.kk-textarea{min-height:76px;resize:vertical}
.kk-radios{display:flex;flex-wrap:wrap;gap:8px}
.kk-radio{border:1px solid var(--rule);border-radius:8px;padding:8px 14px;font-size:13.5px;
  background:var(--surface);color:var(--ink2)}
.kk-radio[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint);color:var(--blue-ink);font-weight:500}
.kk-steps{display:flex;gap:6px;margin-bottom:22px;align-items:center;flex-wrap:wrap}
.kk-stepdot{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.kk-stepdot b{width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:11px;font-weight:500}
.kk-stepdot.on b{background:var(--blue);border-color:var(--blue);color:#fff}
.kk-stepdot.on{color:var(--ink)}

/* ---------- drawer ---------- */
.kk-scrim{position:fixed;inset:0;background:rgba(16,24,36,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.kk-scrim.open{opacity:1;pointer-events:auto}
.kk-drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface);
  border-left:1px solid var(--rule);z-index:61;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column}
.kk-drawer.open{transform:none}
.kk-drawer header{padding:18px 22px 12px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.kk-drawer header h3{margin:0;font-family:var(--serif);font-weight:500;font-size:18px}
.kk-drawer header p{margin:2px 0 0;font-size:12.5px;color:var(--ink3)}
.kk-drawer .kk-dbody{padding:16px 22px 40px;overflow-y:auto}
.kk-x{margin-left:auto;font-size:20px;line-height:1;color:var(--ink3);padding:2px 6px}

/* ---------- toast ---------- */
.kk-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:70;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:9px;font-size:13.5px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .22s;max-width:90vw}
.kk-toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- misc ---------- */
.kk-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.kk-kv dt{color:var(--ink3)}
.kk-kv dd{margin:0}
.kk-evidence{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule2);align-items:flex-start}
.kk-evidence:last-child{border-bottom:none}
.kk-evicon{width:30px;height:30px;border-radius:7px;background:var(--surface2);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:14px;flex:none}
.kk-gapline{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--rule);font-size:13.5px}
.kk-gapline:last-child{border-bottom:none}
.kk-gapline b{font-family:var(--serif);font-weight:500;font-size:16px;color:var(--gold);
  font-variant-numeric:tabular-nums;min-width:52px}
.kk-story{border-left:2px solid var(--rule);padding-left:18px;margin:0 0 4px}
.kk-story h4{margin:0 0 2px;font-size:12.5px;color:var(--ink3);font-weight:500}
.kk-story p{margin:0 0 16px;font-size:14px;max-width:64ch}
.kk-q{border-bottom:1px solid var(--rule2)}
.kk-q summary{padding:13px 2px;cursor:pointer;font-size:15px;font-weight:500;list-style:none;display:flex;gap:10px;align-items:center}
.kk-q summary::-webkit-details-marker{display:none}
.kk-q summary::before{content:"+";color:var(--ink3);font-weight:400;width:14px}
.kk-q[open] summary::before{content:"−"}
.kk-q .kk-qa{padding:0 2px 18px 24px}
.kk-hair{height:1px;background:var(--rule);border:none;margin:26px 0}
.kk-public-hero{background:var(--ink);color:var(--paper);border-radius:14px;padding:clamp(26px,5vw,52px)}
.kk-public-hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,46px);
  line-height:1.08;letter-spacing:-.02em;margin:0 0 10px;max-width:18ch}
.kk-public-hero p{color:color-mix(in srgb, var(--paper) 82%, var(--ink));max-width:52ch;margin:0;font-size:15.5px}
.kk-public-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px;margin-top:38px}
.kk-public-nums b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.6vw,42px);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kk-public-nums span{font-size:12.5px;color:color-mix(in srgb, var(--paper) 68%, var(--ink))}
.kk-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kk-card{border:1px solid var(--rule);border-radius:10px;padding:16px 17px;background:var(--surface);text-align:left;width:100%}
.kk-card:hover{border-color:var(--blue)}
.kk-card h5{margin:0 0 4px;font-size:15px;font-weight:600;font-family:var(--serif)}
.kk-card p{margin:0 0 11px;font-size:13px;color:var(--ink2);min-height:2.6em}
.kk-empty{border:1px dashed var(--rule);border-radius:10px;padding:26px;text-align:center;color:var(--ink3);font-size:14px}
.kk-flag{display:flex;gap:11px;padding:13px 15px;border-radius:9px;background:var(--gold-tint);
  border:1px solid rgba(177,140,84,.3);font-size:13px;color:var(--ink2);margin-bottom:22px}
.kk-flag b{color:var(--gold)}

/* ---------- v2: global filter bar ---------- */
.kk-filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;
  padding:14px 16px;border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);margin-bottom:18px}
.kk-fgroup{display:flex;flex-direction:column;gap:4px;min-width:130px}
.kk-fgroup>label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.kk-fgroup select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface2);
  border:1px solid var(--rule);border-radius:7px;padding:6px 8px;min-width:130px}
.kk-freset{margin-left:auto;align-self:center}
.kk-fsum{font-size:12.5px;color:var(--ink3);margin:-8px 0 16px}

/* ---------- v2: tabs ---------- */
.kk-tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:0 0 18px}
.kk-tabs button{padding:9px 14px;font-size:13.5px;color:var(--ink2);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.kk-tabs button[aria-selected="true"]{color:var(--blue-ink);border-bottom-color:var(--blue);font-weight:500}
.kk-tabs button:hover{color:var(--ink)}

/* ---------- v2: snapshot cards ---------- */
.kk-snap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kk-snapcard{border:1px solid var(--rule);border-radius:10px;padding:15px 16px;
  background:var(--surface);text-align:left;width:100%;display:block}
.kk-snapcard:hover{border-color:var(--blue);background:var(--surface2)}
.kk-snapcard .lab{display:flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3)}
.kk-snapcard .val{display:block;font-family:var(--serif);font-weight:400;
  font-size:30px;line-height:1.1;margin:7px 0 4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kk-snapcard .split{display:block;font-size:12px;color:var(--ink2)}
.kk-snapcard .per{display:block;font-size:11.5px;color:var(--ink3);margin-top:5px}

/* ---------- v2: definition tooltip ---------- */
/* The bubble anchors to the CARD, not the icon, so it can never extend past
   its container and therefore never widens the document. */
.kk-snapcard,.kk-panel,.kk-frow{position:relative}
.kk-tip{display:inline-flex;width:13px;height:13px;flex:none;
  align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:50%;
  font-size:9px;color:var(--ink3);cursor:help}
.kk-tip:hover,.kk-tip:focus{background:var(--blue);border-color:var(--blue);color:#fff}
.kk-tip>span{position:absolute;top:100%;left:12px;right:12px;margin-top:-2px;
  padding:9px 11px;background:var(--ink);color:var(--paper);
  border-radius:7px;font-size:12px;line-height:1.45;letter-spacing:0;text-transform:none;
  opacity:0;visibility:hidden;transition:opacity .12s;z-index:60;pointer-events:none;
  box-shadow:var(--shadow);font-weight:400;text-align:left}
.kk-tip:hover>span,.kk-tip:focus>span{opacity:1;visibility:visible}

/* ---------- v2: maturity progression ---------- */
.kk-seg{display:flex;width:100%;height:30px;border-radius:7px;overflow:hidden;
  border:1px solid var(--rule);background:var(--surface2)}
.kk-seg>button{flex-grow:var(--w,1);min-width:3px;position:relative;border-right:1px solid var(--surface)}
.kk-seg>button:last-child{border-right:none}
.kk-seg>button:hover{filter:brightness(1.12)}
.kk-seglegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:11px;font-size:12px;color:var(--ink2)}
.kk-seglegend span{display:inline-flex;align-items:center;gap:5px}
.kk-swatch{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

/* ---------- v2: sparkline chart ---------- */
.kk-chart{border:1px solid var(--rule);border-radius:9px;padding:13px 14px;background:var(--surface)}
.kk-chart svg{display:block;width:100%;height:110px;overflow:visible}
.kk-chart .pt{fill:var(--blue)}
.kk-chart .pt:hover{r:5}
.kk-chartcap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:7px}

/* ---------- v2: completeness bars ---------- */
.kk-bar{height:7px;border-radius:4px;background:var(--rule2);overflow:hidden;margin:6px 0 3px}
.kk-bar>i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.kk-bar.gold>i{background:var(--gold)}

/* ---------- v2: status badges ---------- */
.kk-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;
  font-size:11.5px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.kk-badge.warn{border-color:var(--gold);color:var(--gold);background:var(--gold-tint)}
.kk-badge.stop{border-style:dashed;color:var(--ink3)}
.kk-badge.ok{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-tint)}

/* ---------- v2: report preview ---------- */
.kk-report{border:1px solid var(--rule);border-radius:10px;background:var(--surface);
  padding:clamp(20px,4vw,42px);max-width:780px}
.kk-report h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:26px 0 8px;letter-spacing:-.01em}
.kk-report h2:first-of-type{margin-top:0}
.kk-report p{font-size:14px;color:var(--ink2);max-width:62ch;margin:0 0 10px}
.kk-reportrule{height:1px;background:var(--rule2);margin:22px 0}

/* ---------- v2: demo tag ---------- */
.kk-demotag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold);border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle}

/* ---------- v2: search ---------- */
.kk-search{position:relative}
.kk-search input{font:inherit;font-size:13px;padding:7px 11px;border-radius:7px;
  border:1px solid var(--rule);background:var(--surface2);color:var(--ink);width:210px}
.kk-results{position:absolute;top:110%;right:0;width:330px;max-height:390px;overflow:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  box-shadow:var(--shadow);z-index:50;padding:5px}
.kk-results button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.kk-results button:hover{background:var(--surface2)}
.kk-results .t{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

/* ---------- v2: sortable headers ---------- */
.kk-table th.sortable{cursor:pointer;user-select:none}
.kk-table th.sortable:hover{color:var(--blue-ink)}
.kk-table th .arw{opacity:.45;font-size:10px}

@media (max-width:760px){
  .kk-filters{gap:9px}
  .kk-fgroup{min-width:calc(50% - 9px)}
  .kk-search input{width:100%}
}

/* ---------- v2: vertical timeline ---------- */
.kk-tl{list-style:none;margin:0;padding:0;position:relative}
.kk-tl::before{content:"";position:absolute;left:5px;top:9px;bottom:9px;width:1px;background:var(--rule)}
.kk-tl li{position:relative;padding:0 0 16px 24px;display:grid;
  grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline}
.kk-tl li:last-child{padding-bottom:0}
.kk-tl li::before{content:"";position:absolute;left:0;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);border:2px solid var(--rule);box-sizing:border-box}
.kk-tl li.on::before{background:var(--blue);border-color:var(--blue)}
.kk-tl li.gold::before{background:var(--gold);border-color:var(--gold)}
.kk-tl li.off::before{background:var(--c0);border-color:var(--c0);border-style:dashed}
.kk-tl .ev{font-size:14px;font-weight:500;color:var(--ink);min-width:0}
.kk-tl .dte{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.kk-tl .src{grid-column:1/-1;font-size:12px;color:var(--ink3);margin-top:-2px}
.kk-tlmore{margin-top:14px;padding-top:13px;border-top:1px solid var(--rule2)}
@media (max-width:520px){
  .kk-tl li{grid-template-columns:1fr}
  .kk-tl .dte{grid-column:1;margin-top:1px}
}

/* ---------- v2: check-in wizard ---------- */
.kk-prog{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.kk-progtrack{flex:1;height:5px;border-radius:3px;background:var(--rule2);overflow:hidden}
.kk-progtrack>i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .2s}
.kk-progstep{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.kk-qtext{font-family:var(--serif);font-weight:400;font-size:clamp(19px,2.4vw,24px);
  line-height:1.25;letter-spacing:-.01em;margin:0 0 6px}
.kk-qhelp{font-size:13.5px;color:var(--ink3);margin:0 0 18px;max-width:54ch}
.kk-ciact{display:flex;gap:8px;align-items:center;margin-top:24px;flex-wrap:wrap}
.kk-ciact .spacer{flex:1}
.kk-writes{list-style:none;margin:0;padding:0}
.kk-writes li{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:10px 0;
  border-bottom:1px solid var(--rule2);align-items:baseline}
.kk-writes li:last-child{border-bottom:none}
.kk-writes .wk{font-size:13.5px;color:var(--ink2)}
.kk-writes .wv{font-size:14px;font-weight:500;text-align:right}
.kk-writes .wn{grid-column:1/-1;font-size:12px;color:var(--ink3)}

/* ---------- v2: misc ---------- */
.kk-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.kk-grid.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kk-pips i.on.off{background:var(--c0)}

</style>

/* =========================================================================
   FORMATTING HELPERS
========================================================================= */
const $ = s => document.querySelector(s);
const byId = (arr, id) => arr.find(x => x.id === id);
const fmt = n => n === null || n === undefined ? '—' : n.toLocaleString('en-US');
const money = n => n === null || n === undefined ? '—' : '$' + n.toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';
const dtShort = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'}) : '—';
const pctOf = (a, b) => b ? Math.round(a / b * 100) : 0;
const plural = (n, one, many) => n === 1 ? one : (many || one + 's');

const productName = p => !p ? 'Unknown product' : (p.name || 'Unnamed product (' + p.id.toUpperCase() + ')');
const participantName = p => p && p.name ? p.name : 'Name pending backfill';

/* =========================================================================
   SELECTORS
   Every screen reads through these. Swapping the mock DB for an API means
   reimplementing this layer and nothing else.
========================================================================= */
const sel = {

  /* ---- graph walks ---------------------------------------------------- */
  history: pid => DB.statusHistory.filter(h => h.productId === pid)
                    .slice().sort((a,b) => a.effectiveDate.localeCompare(b.effectiveDate)),

  // the state the product is in now — may be PAUSED / PIVOTED / SHUT_DOWN
  currentStatus(pid){
    const h = this.history(pid);
    return h.length ? h[h.length - 1].status : 'IDEA';
  },

  // the furthest point on the ladder the product ever reached, which is what
  // the funnel counts. A paused product still reached the users it reached.
  peakRank(pid){
    return this.history(pid).reduce((max, h) => {
      const n = STATUS_META[h.status].n;
      return (n !== null && n > max) ? n : max;
    }, 0);
  },
  reached(pid, status){ return this.peakRank(pid) >= STATUS_META[status].n; },
  isOff(pid){ return OFF_STATUS.includes(this.currentStatus(pid)); },

  /* ---- metrics -------------------------------------------------------- */
  series(pid, type){
    return DB.metrics.filter(m => m.productId === pid && m.type === type)
             .slice().sort((a,b) => a.periodEnd.localeCompare(b.periodEnd));
  },
  latest(pid, type){
    const s = this.series(pid, type);
    return s.length ? s[s.length - 1] : null;
  },
  metricTypesFor(pid){
    return [...new Set(DB.metrics.filter(m => m.productId === pid).map(m => m.type))];
  },

  /* ---- joins ---------------------------------------------------------- */
  participant: id => byId(DB.participants, id),
  product: id => byId(DB.products, id),
  cohort: id => byId(DB.cohorts, id),
  programme: id => byId(DB.programmes, id),
  enrolmentOf: pid => DB.enrolments.find(e => e.participantId === pid),
  productsOf: pid => DB.products.filter(p => p.participantId === pid),
  outcomesOf: pid => DB.outcomes.filter(o => o.participantId === pid),
  evidenceOf: pid => DB.evidence.filter(e => e.productId === pid),
  evidenceById: id => byId(DB.evidence, id),
  domainOf: pid => DB.domainImpacts.filter(d => d.productId === pid),
  storyOf: pid => DB.stories.find(s => s.productId === pid),
  checkinsOf: pid => DB.checkins.filter(c => c.participantId === pid),
  lastCheckin(pid){
    const done = this.checkinsOf(pid).filter(c => c.completedDate)
                   .sort((a,b) => a.completedDate.localeCompare(b.completedDate));
    return done.length ? done[done.length - 1] : null;
  },
  openCheckin(pid){
    return this.checkinsOf(pid).find(c => c.status === 'OVERDUE' || c.status === 'DUE') || null;
  },

  /* ---- global filter -------------------------------------------------- */
  // Returns the product set the whole screen should be reasoning about.
  products(f){
    f = f || state.filters;
    return DB.products.filter(p => {
      if(f.programme !== 'all' && p.programmeId !== f.programme) return false;
      if(f.cohort !== 'all' && p.cohortId !== f.cohort) return false;
      if(f.domain !== 'all' && (p.domain || 'Unclassified') !== f.domain) return false;
      if(f.status !== 'all'){
        if(f.status === 'has_users'   && !this.reached(p.id,'VALIDATED')) return false;
        if(f.status === 'no_users'    &&  this.reached(p.id,'VALIDATED')) return false;
        if(f.status === 'revenue'     && !this.reached(p.id,'REVENUE'))   return false;
        if(f.status === 'deployed'    && !this.reached(p.id,'DEPLOYED'))  return false;
        if(f.status === 'built'       && !this.reached(p.id,'BUILT'))     return false;
        if(f.status === 'traction'    && !this.reached(p.id,'TRACTION'))  return false;
        if(f.status === 'business'    && !this.reached(p.id,'BUSINESS'))  return false;
        if(f.status === 'active'      && this.currentStatus(p.id) !== 'ACTIVE') return false;
        if(f.status === 'off'         && !this.isOff(p.id))               return false;
        if(f.status === 'no_revenue_data' && this.latest(p.id,'REVENUE'))  return false;
      }
      if(f.verification !== 'all'){
        const best = this.bestVerification(p.id);
        if(best !== f.verification) return false;
      }
      if(f.period !== 'all'){
        const cutoff = {d90:'2026-06-19', d180:'2026-03-21'}[f.period];
        const any = DB.metrics.some(m => m.productId === p.id && m.periodEnd >= cutoff);
        if(!any) return false;
      }
      return true;
    });
  },

  participants(f){
    f = f || state.filters;
    return DB.participants.filter(pa => {
      const e = this.enrolmentOf(pa.id);
      if(!e) return false;
      if(f.programme !== 'all' && e.programmeId !== f.programme) return false;
      if(f.cohort !== 'all' && e.cohortId !== f.cohort) return false;
      if(f.domain !== 'all'){
        if(!this.productsOf(pa.id).some(p => (p.domain || 'Unclassified') === f.domain)) return false;
      }
      return true;
    });
  },

  cohorts(f){
    f = f || state.filters;
    return DB.cohorts.filter(c => {
      if(f.programme !== 'all' && c.programmeId !== f.programme) return false;
      if(f.cohort !== 'all' && c.id !== f.cohort) return false;
      return true;
    });
  },

  // strongest verification any metric on this product carries
  bestVerification(pid){
    const ms = DB.metrics.filter(m => m.productId === pid);
    if(!ms.length) return 'UNKNOWN';
    return ms.reduce((best, m) =>
      VERIF[m.verification].rank > VERIF[best].rank ? m.verification : best, ms[0].verification);
  },

  /* ---- headline aggregates -------------------------------------------- */
  // Canonical enrolment: the cohort's established participant count, which is
  // NOT the same as the number of participant records the platform holds.
  peopleTrained(f){
    return this.cohorts(f).reduce((s,c) => s + (c.canonical.participants || 0), 0);
  },
  recordsHeld(f){ return this.participants(f).length; },

  funnel(f){
    const P = this.products(f);
    const builders = new Set(P.filter(p => this.reached(p.id,'BUILT')).map(p => p.participantId));
    return [
      {k:'trained',  label:'People trained',    sub:'Enrolled on a cohort',            n:this.peopleTrained(f), filter:null,
       def:'Unique participants enrolled on a KayKav cohort, from programme records.'},
      {k:'builders', label:'Builders',          sub:'Took a product past an idea',     n:builders.size, filter:'built',
       def:'Participants with at least one product that reached a functional MVP.'},
      {k:'built',    label:'Products built',    sub:'A functional MVP exists',         n:P.filter(p => this.reached(p.id,'BUILT')).length, filter:'built',
       def:'Products where a functional MVP exists and can perform its core job. Does not require users, revenue or a launch.'},
      {k:'deployed', label:'Products deployed', sub:'Reached a live URL',              n:P.filter(p => this.reached(p.id,'DEPLOYED')).length, filter:'deployed',
       def:'Products that reached a real deployment environment and were accessible to intended users.'},
      {k:'users',    label:'Products with users',sub:'A real person outside the build', n:P.filter(p => this.reached(p.id,'VALIDATED')).length, filter:'has_users',
       def:'Products with evidence that at least one real external user used it for its intended job.'},
      {k:'traction', label:'Products with traction',sub:'Sustained or growing use',    n:P.filter(p => this.reached(p.id,'TRACTION')).length, filter:'traction',
       def:'Products showing sustained or growing adoption rather than a single spike.'},
      {k:'revenue',  label:'Revenue-generating',sub:'A real customer has paid',        n:P.filter(p => this.reached(p.id,'REVENUE')).length, filter:'revenue',
       def:'Products where at least one real customer has paid. Never includes programme fees, grants or projections.'},
      {k:'business', label:'Businesses / jobs', sub:'An ongoing operation',            n:P.filter(p => this.reached(p.id,'BUSINESS')).length, filter:'business',
       def:'Products that became an ongoing commercial or organisational operation.'}
    ];
  },

  // Distribution of where products are *now*, including the states that are
  // not on the ladder. This is the "how far did they get" question.
  maturity(f){
    const P = this.products(f);
    const order = ['IDEA','BUILT','DEPLOYED','VALIDATED','ACTIVE','TRACTION','REVENUE','BUSINESS','SCALE','PAUSED','PIVOTED','SHUT_DOWN'];
    return order.map(s => ({status:s, label:STATUS_META[s].label, desc:STATUS_META[s].desc,
      n:P.filter(p => this.currentStatus(p.id) === s).length})).filter(r => r.n > 0);
  },

  // Users reached, split by how strongly each figure is evidenced.
  usersReached(f){
    const P = this.products(f);
    let verified = 0, claimed = 0, known = 0;
    P.forEach(p => {
      const m = this.latest(p.id,'TOTAL_USERS');
      if(!m || m.value === null) return;
      known++;
      if(VERIF[m.verification].rank >= 2) verified += m.value; else claimed += m.value;
    });
    return {verified, claimed, total:verified + claimed, knownOn:known, of:P.length};
  },

  economicValue(f){
    const P = this.products(f);
    let verifiedRev = 0, claimedRev = 0, revProducts = 0;
    P.forEach(p => {
      const m = this.latest(p.id,'REVENUE');
      if(!m || !m.value) return;
      revProducts++;
      if(VERIF[m.verification].rank >= 2) verifiedRev += m.value; else claimedRev += m.value;
    });
    const ids = new Set(P.map(p => p.participantId));
    const outs = DB.outcomes.filter(o => ids.has(o.participantId));
    const builderIncome = outs.filter(o => o.financialValue)
                              .reduce((s,o) => s + o.financialValue, 0);
    return {
      verifiedRevenue:verifiedRev, claimedRevenue:claimedRev, revenueProducts:revProducts,
      builderIncome, builderIncomeVerified:false,
      businesses:outs.filter(o => o.type === 'BUSINESS_FORMATION').length,
      funding:outs.filter(o => o.type === 'FUNDING_RAISED').length,
      contracts:outs.filter(o => o.type === 'CONTRACT_WON').length,
      jobs:null   // no jobs data has been collected — deliberately null, not 0
    };
  },

  survival(cohortId, windowDays){
    const c = this.cohort(cohortId);
    if(!c || !c.demoDay) return {state:'no_cohort'};
    const due = new Date(new Date(c.demoDay + 'T00:00:00').getTime() + windowDays * 864e5)
                  .toISOString().slice(0,10);
    if(due > TODAY) return {state:'not_due', due};
    const shipped = DB.products.filter(p => p.cohortId === cohortId && this.reached(p.id,'DEPLOYED'));
    if(!shipped.length) return {state:'no_base'};
    const alive = shipped.filter(p => !this.isOff(p.id) && this.reached(p.id,'VALIDATED'));
    return {state:'ok', pct:pctOf(alive.length, shipped.length), alive:alive.length, base:shipped.length, due};
  },

  /* ---- measurement health & gaps -------------------------------------- */
  health(f){
    const P = this.products(f);
    const pids = new Set(P.map(p => p.id));
    const parts = this.participants(f);
    const partIds = new Set(parts.map(p => p.id));
    return {
      overdue: DB.checkins.filter(c => c.status === 'OVERDUE' && partIds.has(c.participantId)).length,
      awaiting: DB.evidence.filter(e => pids.has(e.productId) &&
                  ['EVIDENCE_SUBMITTED','NEEDS_CLARIFICATION'].includes(e.verification)).length,
      rejected: DB.evidence.filter(e => pids.has(e.productId) && e.verification === 'REJECTED').length,
      incompleteProducts: P.filter(p => !p.name || !p.liveUrl || !p.domain).length,
      unbackfilled: this.peopleTrained(f) - this.recordsHeld(f),
      noRevenueData: P.filter(p => this.reached(p.id,'DEPLOYED') && !this.latest(p.id,'REVENUE')).length,
      noUserData: P.filter(p => this.reached(p.id,'DEPLOYED') && !this.latest(p.id,'TOTAL_USERS')).length
    };
  },

  dataQuality(){
    const score = (rows, fields) => {
      let filled = 0, total = 0;
      rows.forEach(r => fields.forEach(fld => { total++; if(r[fld] !== null && r[fld] !== undefined && r[fld] !== '') filled++; }));
      return total ? Math.round(filled / total * 100) : 0;
    };
    const allMetrics = DB.metrics.length;
    const verified = DB.metrics.filter(m => VERIF[m.verification].rank >= 2).length;
    const held = DB.participants.length;
    const canonical = DB.cohorts.reduce((s,c) => s + (c.canonical.participants || 0), 0);
    return [
      {entity:'Participant records', complete:Math.round(held / canonical * 100),
       held, expected:canonical,
       issues:[(canonical - held) + ' enrolled participants have no record yet',
               DB.participants.filter(p => !p.name).length + ' records have no name',
               DB.participants.filter(p => !p.country).length + ' records have no country']},
      {entity:'Product records', complete:score(DB.products, ['name','liveUrl','domain','description']),
       held:DB.products.length, expected:DB.products.length,
       issues:[DB.products.filter(p => !p.name).length + ' missing a product name',
               DB.products.filter(p => !p.liveUrl).length + ' missing a live URL',
               DB.products.filter(p => !p.domain).length + ' missing a domain classification']},
      {entity:'Product mappings', complete:100, held:DB.products.length, expected:DB.products.length,
       issues:['Every product resolves to a participant and a cohort',
               DB.participants.filter(p => !DB.products.some(x => x.participantId === p.id)).length + ' participants have no product recorded']},
      {entity:'Check-ins', complete:pctOf(DB.checkins.filter(c => c.status === 'COMPLETED').length,
                                          DB.checkins.filter(c => c.status !== 'NOT_DUE').length),
       held:DB.checkins.filter(c => c.status === 'COMPLETED').length,
       expected:DB.checkins.filter(c => c.status !== 'NOT_DUE').length,
       issues:[DB.checkins.filter(c => c.status === 'OVERDUE').length + ' windows are overdue',
               DB.checkins.filter(c => c.status === 'NOT_DUE').length + ' windows have not opened yet']},
      {entity:'Evidence', complete:pctOf(DB.evidence.filter(e => VERIF[e.verification].rank >= 2).length, DB.evidence.length),
       held:DB.evidence.length, expected:DB.evidence.length,
       issues:[DB.evidence.filter(e => e.verification === 'EVIDENCE_SUBMITTED').length + ' items await review',
               DB.evidence.filter(e => e.verification === 'REJECTED').length + ' were rejected',
               DB.evidence.filter(e => e.verification === 'NEEDS_CLARIFICATION').length + ' need clarification']},
      {entity:'Outcome records', complete:pctOf(DB.outcomes.filter(o => VERIF[o.verification].rank >= 2).length, DB.outcomes.length),
       held:DB.outcomes.length, expected:DB.participants.length,
       issues:[(DB.participants.length - new Set(DB.outcomes.map(o => o.participantId)).size) + ' participants have no outcome recorded either way',
               DB.outcomes.filter(o => o.verification === 'SELF_REPORTED').length + ' rest on self-report only']}
    ].concat([{entity:'Metric confidence', complete:pctOf(verified, allMetrics),
       held:verified, expected:allMetrics, confidence:true,
       issues:[allMetrics + ' metric records in total',
               DB.metrics.filter(m => m.verification === 'SELF_REPORTED').length + ' are self-reported only']}]);
  },

  /* ---- search ---------------------------------------------------------- */
  search(q){
    q = q.trim().toLowerCase();
    if(q.length < 2) return [];
    const out = [];
    DB.participants.forEach(p => { if((p.name||'').toLowerCase().includes(q))
      out.push({type:'Builder', name:participantName(p), sub:(this.cohort(this.enrolmentOf(p.id).cohortId)||{}).name, go:'builder:'+p.id}); });
    DB.products.forEach(p => { if((p.name||'').toLowerCase().includes(q) || (p.aka||'').toLowerCase().includes(q))
      out.push({type:'Product', name:productName(p), sub:STATUS_META[this.currentStatus(p.id)].label, go:'product:'+p.id}); });
    DB.cohorts.forEach(c => { if(c.name.toLowerCase().includes(q))
      out.push({type:'Cohort', name:c.name, sub:c.status, go:'cohort:'+c.id}); });
    DB.stories.forEach(s => { if(s.title.toLowerCase().includes(q))
      out.push({type:'Story', name:s.title, sub:productName(this.product(s.productId)), go:'story:'+s.id}); });
    return out.slice(0, 12);
  },

  // Story language must not promote a claim. Returns the phrasing for a value.
  storyClaim(pid, type){
    const m = this.latest(pid, type);
    if(!m) return null;
    const v = fmt(m.value) + ' ' + METRIC_META[type].unit;
    return VERIF[m.verification].rank >= 2
      ? {text:v + ' — verified through ' + (m.verification === 'CONNECTED_DATA' ? 'a connected system' : 'submitted evidence'), strong:true}
      : {text:'The builder reports ' + v, strong:false};
  }
};

/* =========================================================================
   STATE
========================================================================= */
const state = {
  mode:'internal',                 // internal | funder | public | builder
  route:{name:'overview', id:null},
  tab:null,

/* =========================================================================
   UI COMPONENTS
   Status is always communicated with text, never colour alone (§51).
========================================================================= */

// definition tooltip
const tip = text => '<span class="kk-tip" tabindex="0" role="note" aria-label="' + esc(text) + '">i<span>' + esc(text) + '</span></span>';

// verification badge — always carries its label as words
function vbadge(v, opts){
  const o = opts || {}, meta = VERIF[v] || VERIF.UNKNOWN;
  const cls = meta.rank >= 2 ? 'ok' : meta.rank <= -2 ? 'stop' : meta.rank === -1 ? 'stop' : 'warn';
  const mark = meta.rank >= 3 ? '◉' : meta.rank === 2 ? '✓' : meta.rank === 1 ? '◐'
             : meta.rank === 0 ? '○' : meta.rank <= -2 ? '✕' : '—';
  return '<span class="kk-badge ' + cls + '">' + mark + ' ' + esc(o.label || meta.short) + '</span>';
}

/* A metric value. This is the single place the unknown-vs-zero rule lives.
   No measurement  -> em dash + "Not yet measured"
   Measured zero   -> 0 + whatever verification it carries                  */
function mval(pid, type, opts){
  const o = opts || {}, m = sel.latest(pid, type);
  if(!m || m.value === null){
    return '<span class="kk-fig gap">—</span>' +
           (o.bare ? '' : '<span class="kk-gapcell">Not yet measured</span>');
  }
  const meta = METRIC_META[type];
  const txt = meta.money ? money(m.value) : fmt(m.value);
  return '<span class="kk-fig">' + txt + '</span>' +
         (o.bare ? '' : '<div style="margin-top:4px">' + vbadge(m.verification) + '</div>');
}

function statusPill(s){
  const m = STATUS_META[s];
  const cls = s === 'SHUT_DOWN' || s === 'PAUSED' || s === 'PIVOTED' ? 'stop'
            : m.n >= 6 ? 'warn' : m.n >= 3 ? 'ok' : '';
  return '<span class="kk-badge ' + cls + '">' + esc(m.label) + '</span>';
}

function statusPips(pid){
  const peak = sel.peakRank(pid), off = sel.isOff(pid);
  return '<span class="kk-pips">' + STATUS.map((s,i) =>
    '<i class="' + (i <= peak ? (off ? 'on gold' : 'on') : '') + '"></i>').join('') + '</span>';
}

function emptyState(title, body){
  return '<div class="kk-empty"><b style="display:block;margin-bottom:5px;color:var(--ink)">' +
         esc(title) + '</b>' + esc(body) + '</div>';
}

// a snapshot card: metric, definition, verification split, period, destination
function snapCard(c){
  return '<button class="kk-snapcard" data-act="go" data-arg="' + (c.go || 'products') + '">' +
    '<span class="lab">' + esc(c.label) + ' ' + tip(c.def) + '</span>' +
    '<span class="val">' + c.value + '</span>' +
    (c.split ? '<span class="split">' + c.split + '</span>' : '') +
    '<span class="per">' + esc(c.period || 'Across all cohorts') + '</span>' +
  '</button>';
}

// inline sparkline. Only drawn when there are enough points to mean anything.
function metricChart(pid, type){
  const s = sel.series(pid, type);
  if(s.length < 3) return '';
  const w = 560, h = 110, pad = 6;
  const max = Math.max(...s.map(p => p.value)) || 1;
  const x = i => pad + i * ((w - pad * 2) / (s.length - 1));
  const y = v => h - pad - (v / max) * (h - pad * 2);
  const pts = s.map((p,i) => x(i) + ',' + y(p.value)).join(' ');
  const meta = METRIC_META[type];
  return '<div class="kk-chart">' +
    '<div class="kk-sub" style="margin-bottom:8px">' + esc(meta.label) + ' over time</div>' +
    '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(meta.label) +
      ' rising from ' + fmt(s[0].value) + ' to ' + fmt(s[s.length-1].value) + '">' +
    '<polyline fill="none" stroke="var(--blue)" stroke-width="2" points="' + pts + '"/>' +
    s.map((p,i) => '<circle class="pt" cx="' + x(i) + '" cy="' + y(p.value) + '" r="3.5">' +
      '<title>' + esc(dtShort(p.periodEnd) + ' · ' + fmt(p.value) + ' ' + meta.unit +
      ' · ' + VERIF[p.verification].short) + '</title></circle>').join('') +
    '</svg>' +
    '<div class="kk-chartcap"><span>' + esc(dtShort(s[0].periodEnd)) + '</span>' +
    '<span>' + esc(dtShort(s[s.length-1].periodEnd)) + '</span></div></div>';
}

// segmented maturity distribution (never a pie)
function maturityBar(rows){
  const total = rows.reduce((s,r) => s + r.n, 0) || 1;
  const tone = s => OFF_STATUS.includes(s) ? 'var(--c0)'
    : STATUS_META[s].n >= 6 ? 'var(--c3)' : STATUS_META[s].n >= 3 ? 'var(--c2)' : 'var(--c1)';
  return '<div class="kk-seg">' + rows.map(r =>
      '<button style="--w:' + r.n + ';background:' + tone(r.status) + '" ' +
        'data-act="go" data-arg="products" ' +
        'title="' + esc(r.label + ': ' + r.n + ' of ' + total) + '" ' +
        'aria-label="' + esc(r.label + ': ' + r.n + ' products') + '"></button>').join('') +
    '</div><div class="kk-seglegend">' + rows.map(r =>
      '<span><i class="kk-swatch" style="background:' + tone(r.status) + '"></i>' +
      esc(r.label) + ' ' + r.n + '</span>').join('') + '</div>';
}

function bar(pctv, gold){
  return '<div class="kk-bar' + (gold ? ' gold' : '') + '"><i style="width:' + Math.max(0,Math.min(100,pctv)) + '%"></i></div>';
}

function table(head, rows, opts){
  const o = opts || {};
  return '<div class="kk-tablewrap"><table class="kk-table"' + (o.narrow ? ' style="min-width:0"' : '') + '>' +
    '<thead><tr>' + head.map(h => typeof h === 'string'
      ? '<th>' + h + '</th>'
      : '<th class="' + (h.num ? 'num ' : '') + 'sortable" data-act="sort" data-arg="' + h.key + '">' +
        esc(h.label) + ' <span class="arw">' + (state.sort.key === h.key ? (state.sort.dir > 0 ? '▲' : '▼') : '↕') + '</span></th>'
    ).join('') + '</tr></thead><tbody>' +
    (rows || '<tr><td colspan="' + head.length + '" class="kk-muted">Nothing matches these filters.</td></tr>') +
    '</tbody></table></div>';
}

function sortRows(arr, keyFn){
  if(!state.sort.key) return arr;
  return arr.slice().sort((a,b) => {
    const A = keyFn(a), B = keyFn(b);
    if(A === null || A === undefined) return 1;
    if(B === null || B === undefined) return -1;
    return (typeof A === 'string' ? A.localeCompare(B) : A - B) * state.sort.dir;
  });
}

/* ---- global filter bar ------------------------------------------------ */
function filterBar(){
  const f = state.filters;
  const opt = (v, label, cur) => '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + esc(label) + '</option>';
  const domains = [...new Set(DB.products.map(p => p.domain).filter(Boolean))].sort();
  const g = (key, label, opts) =>
    '<div class="kk-fgroup"><label for="f-' + key + '">' + esc(label) + '</label>' +
    '<select id="f-' + key + '" data-filter="' + key + '">' + opts + '</select></div>';

  return '<div class="kk-filters" role="group" aria-label="Filters">' +
    g('programme','Programme', opt('all','All programmes', f.programme) +
      DB.programmes.map(p => opt(p.id, p.name, f.programme)).join('')) +
    g('cohort','Cohort', opt('all','All cohorts', f.cohort) +
      DB.cohorts.map(c => opt(c.id, c.name, f.cohort)).join('')) +
    g('period','Period', opt('all','All time', f.period) + opt('d90','Last 90 days', f.period) + opt('d180','Last 180 days', f.period)) +
    g('verification','Verification', opt('all','All', f.verification) +
      ['CONNECTED_DATA','KAYKAV_VERIFIED','EVIDENCE_SUBMITTED','SELF_REPORTED','UNKNOWN']
        .map(v => opt(v, VERIF[v].label, f.verification)).join('')) +
    g('domain','Domain', opt('all','All domains', f.domain) + domains.map(d => opt(d, d, f.domain)).join('')) +
    g('status','Status', opt('all','Any status', f.status) + opt('deployed','Reached deployed', f.status) +
      opt('has_users','Has users', f.status) + opt('no_users','No users yet', f.status) +
      opt('revenue','Revenue-generating', f.status) + opt('active','Currently active', f.status) +
      opt('off','Paused / pivoted / shut down', f.status)) +
    '<div class="kk-freset"><button class="kk-btn ghost sm" data-act="resetfilters">Reset</button></div>' +
  '</div>';
}

function filterSummary(){
  const f = state.filters, bits = [];
  if(f.programme !== 'all') bits.push(sel.programme(f.programme).name);
  if(f.cohort !== 'all') bits.push(sel.cohort(f.cohort).name);
  if(f.period !== 'all') bits.push(f.period === 'd90' ? 'last 90 days' : 'last 180 days');
  if(f.verification !== 'all') bits.push(VERIF[f.verification].label);
  if(f.domain !== 'all') bits.push(f.domain);
  if(f.status !== 'all') bits.push(f.status.replace(/_/g,' '));
  return bits.length
    ? '<p class="kk-fsum">Filtered by ' + esc(bits.join(' · ')) + '. ' +
      sel.products().length + ' of ' + DB.products.length + ' products in scope.</p>'
    : '';
}

function shell(inner){
  const modes = [['internal','Internal Observatory'],['funder','Funder View'],['public','Public'],['builder','Builder']];
  const results = state.query.length > 1 ? sel.search(state.query) : [];
  const top =
    '<header class="kk-top">' +
      '<span class="kk-wordmark"><b>KayKav Builder Impact</b><span>Impact platform v2<span class="kk-demotag">Demo data</span></span></span>' +
      (state.mode === 'internal' || state.mode === 'funder'
        ? '<div class="kk-search"><input type="search" placeholder="Search builders, products, cohorts…" ' +
          'value="' + esc(state.query) + '" data-act="search" aria-label="Search">' +
          (results.length ? '<div class="kk-results">' + results.map(r =>
            '<button data-act="go" data-arg="' + r.go + '"><span class="t">' + esc(r.type) + '</span><br>' +
            esc(r.name) + ' <span class="kk-muted">' + esc(r.sub || '') + '</span></button>').join('') + '</div>' : '') +
          '</div>' : '') +
      '<div class="kk-modes" role="group" aria-label="View as">' +
        modes.map(([k,t]) => '<button data-act="mode" data-arg="' + k + '" aria-pressed="' +
          (state.mode === k) + '">' + t + '</button>').join('') +
      '</div>' +
      '<button class="kk-theme" data-act="theme" title="Switch light or dark" aria-label="Switch light or dark">◐</button>' +
    '</header>';

  const nav = NAV[state.mode];
  if(!nav) return top + '<div class="kk-body"><main class="kk-main">' + inner + '</main></div>';

  const health = state.mode === 'internal' ? sel.health() : null;
  const badgeFor = r => {
    if(!health) return '';
    if(r === 'evidence' && health.awaiting) return '<span class="kk-fcount">' + health.awaiting + '</span>';
    if(r === 'checkins' && health.overdue) return '<span class="kk-fcount">' + health.overdue + '</span>';
    return '';
  };

  const rail = '<nav class="kk-rail" aria-label="Sections">' + nav.map(i => {
    if(i.g) return '<h6>' + esc(i.g) + '</h6>';
    const cur = state.route.name === i.r ? ' aria-current="page"' : '';
    return '<button class="kk-navitem" data-act="go" data-arg="' + i.r + '"' + cur + '>' +
           esc(i.t) + badgeFor(i.r) + '</button>';
  }).join('') + '</nav>';

  return top + '<div class="kk-body">' + rail + '<main class="kk-main">' + inner + '</main></div>';
}

/* ---- drawer & toast ---------------------------------------------------- */
function openDrawer(title, sub, body){
  $('#drawer').innerHTML =
    '<header><div><h3>' + title + '</h3><p>' + sub + '</p></div>' +
    '<button class="kk-x" data-act="closedrawer" aria-label="Close">×</button></header>' +
    '<div class="kk-dbody">' + body + '</div>';
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden','false');
  $('#scrim').classList.add('open');
}
function closeDrawer(){
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden','true');
  $('#scrim').classList.remove('open');
}
let toastT;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

function demoBanner(){

function impactSnapshot(){
  const f = state.filters, F = sel.funnel(f), u = sel.usersReached(f), ec = sel.economicValue(f);
  const get = k => F.find(x => x.k === k);
  const splitFor = k => {
    const P = sel.products(f).filter(p => sel.reached(p.id, k));
    const v = P.filter(p => VERIF[sel.bestVerification(p.id)].rank >= 2).length;
    return v + ' verified · ' + (P.length - v) + ' on weaker evidence';
  };
  const cards = [
    {label:'People trained', value:fmt(sel.peopleTrained(f)), go:'cohorts',
     def:'Unique participants enrolled on a KayKav cohort, from programme records.',
     split:'<span class="kk-muted">' + sel.recordsHeld(f) + ' participant records held · ' +
       sel.health(f).unbackfilled + ' still to backfill</span>',
     period:DB.reachClaim.label + ' claimed programme-wide — not yet reconciled'},
    {label:'Builders', value:fmt(get('builders').n), go:'builders', def:get('builders').def,
     split:'Participants who took a product past an idea', period:'Across cohorts in scope'},
    {label:'Products built', value:fmt(get('built').n), go:'products', def:get('built').def,
     split:'Built is not the same as successful', period:'Across cohorts in scope'},
    {label:'Products deployed', value:fmt(get('deployed').n), go:'products', def:get('deployed').def,
     split:splitFor('DEPLOYED'), period:'Reached a live URL'},
    {label:'Products with users', value:fmt(get('users').n), go:'products', def:get('users').def,
     split:splitFor('VALIDATED'), period:'A real person outside the build'},
    {label:'Revenue-generating', value:fmt(get('revenue').n), go:'products', def:get('revenue').def,
     split:splitFor('REVENUE'), period:'Never includes programme fees'},
    {label:'Economic value', value:money(ec.verifiedRevenue), go:'outcomes',
     def:'Verified product revenue only. Builder income and programme fees are reported separately.',
     split:ec.claimedRevenue ? money(ec.claimedRevenue) + ' more reported but unverified' : 'Verified product revenue',
     period:'Programme revenue is excluded by rule'},
    {label:'Businesses / jobs', value:fmt(get('business').n) + ' / —', go:'outcomes',
     def:'Products that became an ongoing operation, and jobs attributable to them.',
     split:'Jobs: not yet measured', period:'No jobs data has been collected'}
  ];
  return '<section class="kk-section"><h2 class="kk-h2">The impact snapshot</h2>' +
    '<p class="kk-sub">Every card opens the records behind it. Where a number has not been measured it says so rather than showing a zero.</p>' +
    '<div class="kk-snap">' + cards.map(snapCard).join('') + '</div></section>';
}

function impactFunnel(){
  const F = sel.funnel(state.filters), max = Math.max(...F.map(r => r.n)) || 1;
  return '<section class="kk-section"><h2 class="kk-h2">From learning to real-world impact</h2>' +
    '<p class="kk-sub">Each stage is a subset of the one above it. The funnel narrows because that is what happens, not because the earlier stages failed. Shipping a product is not the same as impact.</p>' +
    '<div class="kk-panel"><div class="kk-funnel">' + F.map(r =>
      '<button class="kk-frow" data-act="funnel" data-arg="' + (r.filter || 'all') + '">' +
      '<span><b>' + esc(r.label) + '</b> ' + tip(r.def) + '<small>' + esc(r.sub) + '</small></span>' +
      '<span class="kk-ftrack"><i style="width:' + Math.max(2, r.n / max * 100) + '%"></i></span>' +
      '<span class="kk-fig">' + fmt(r.n) + '</span></button>').join('') +
    '</div></div></section>';
}

function productMaturity(){
  const rows = sel.maturity(state.filters);
  if(!rows.length) return '';
  return '<section class="kk-section"><h2 class="kk-h2">Where products are today</h2>' +
    '<p class="kk-sub">Current state, not the furthest point reached. Paused, pivoted and shut-down products are shown here rather than quietly dropped.</p>' +
    '<div class="kk-panel">' + maturityBar(rows) + '</div></section>';
}

function cohortProgression(){
  const cs = sel.cohorts(state.filters).filter(c => c.canonical.participants !== null);
  if(!cs.length) return '';
  const metrics = [
    {lab:'Participants', fn:c => fmt(c.canonical.participants), canon:true},
    {lab:'Countries',    fn:c => c.canonical.countries.length ? fmt(c.canonical.countries.length) : null, canon:true},
    {lab:'Continents',   fn:c => c.canonical.continents !== null ? fmt(c.canonical.continents) : null, canon:true},
    {lab:'Products built',   fn:c => fmt(cohortCount(c.id,'BUILT'))},
    {lab:'Products deployed',fn:c => cohortCount(c.id,'DEPLOYED') ? fmt(cohortCount(c.id,'DEPLOYED')) : null},
    {lab:'Products with users', fn:c => cohortCount(c.id,'VALIDATED') ? fmt(cohortCount(c.id,'VALIDATED')) : null},
    {lab:'Revenue-generating',  fn:c => cohortCount(c.id,'REVENUE') ? fmt(cohortCount(c.id,'REVENUE')) : null},
    {lab:'Businesses formed',   fn:c => cohortCount(c.id,'BUSINESS') ? fmt(cohortCount(c.id,'BUSINESS')) : null}
  ];
  const notYet = '<span class="kk-gapcell">— Not yet measured</span>';
  const rows = metrics.map(m =>
    '<tr><td>' + esc(m.lab) + '</td>' +
    cs.map(c => '<td class="num">' + (m.fn(c) === null ? notYet : m.fn(c)) + '</td>').join('') +
    '</tr>').join('');
  return '<section class="kk-section"><h2 class="kk-h2">Impact by cohort</h2>' +
    '<p class="kk-sub">Cohort 02 finished its programme in August. Most of its downstream windows have not opened, so those cells are unmeasured rather than zero.</p>' +
    table(['Metric'].concat(cs.map(c => c.name)), rows) + '</section>';
}
function cohortCount(cid, status){
  return DB.products.filter(p => p.cohortId === cid && sel.reached(p.id, status)).length;
}

function longitudinal(){
  const cs = sel.cohorts(state.filters).filter(c => c.demoDay);
  if(!cs.length) return '';
  const windows = [30, 90, 180, 365];
  const cell = s => {
    if(s.state === 'not_due') return '<span class="kk-gapcell">Window opens ' + dtShort(s.due) + '</span>';
    if(s.state !== 'ok') return '<span class="kk-gapcell">— Not yet measured</span>';
    return '<b>' + s.pct + '%</b><div class="kk-muted" style="font-size:12px">' + s.alive + ' of ' + s.base + ' still active</div>';
  };
  const rows = cs.map(c => '<tr><td>' + esc(c.name) + '</td>' +
    windows.map(w => '<td>' + cell(sel.survival(c.id, w)) + '</td>').join('') + '</tr>').join('');
  return '<section class="kk-section"><h2 class="kk-h2">What happened after the programme?</h2>' +
    '<p class="kk-sub">Share of shipped products still active at each checkpoint. A window that has not come round yet is shown as pending, never as zero.</p>' +
    table(['Cohort','30 days','90 days','180 days','365 days'], rows) + '</section>';
}

// One vertical timeline, used inline (truncated) and in the drawer (full).
function timelineHTML(events){
  return '<ol class="kk-tl">' + events.map(e =>
    '<li class="' + (e.tone || 'on') + '">' +
      '<span class="ev">' + esc(e.t) + '</span>' +
      '<span class="dte">' + (e.d ? dt(e.d) : '\u2014') + '</span>' +
      (e.s ? '<span class="src">' + esc(e.s) + '</span>' : '') +
    '</li>').join('') + '</ol>';
}

// The builder's journey, oldest first. Shared by the profile and the drawer.
function builderTimeline(id){
  const e = sel.enrolmentOf(id), out = [];
  if(e){
    out.push({d:e.enrolmentDate, t:'Joined ' + sel.cohort(e.cohortId).name, s:'Programme record'});
    if(e.completionDate) out.push({d:e.completionDate, t:'Completed the programme', s:'Programme record'});
    else out.push({d:null, t:e.completionStatus === 'WITHDRAWN' ? 'Withdrew from the programme' : 'Did not complete the programme',
                   s:'Programme record', tone:'off'});
  }
  sel.productsOf(id).forEach(p => sel.history(p.id).forEach(h =>
    out.push({d:h.effectiveDate, t:STATUS_META[h.status].label + ' — ' + productName(p),
      s:h.source.replace(/_/g,' ').toLowerCase() + (h.notes ? ' · ' + h.notes : ''),
      tone:OFF_STATUS.includes(h.status) ? 'off' : (STATUS_META[h.status].n >= 6 ? 'gold' : 'on')})));
  sel.checkinsOf(id).filter(c => c.completedDate).forEach(c =>
    out.push({d:c.completedDate, t:'Returned the ' + c.type.replace('_',' ').toLowerCase() + ' check-in',
      s:'Impact check-in'}));
  return out.sort((a,b) => (a.d || '9999').localeCompare(b.d || '9999'));
}

function evRow(ev){
  return '<button class="kk-gapline" style="width:100%;text-align:left" data-act="claim" data-arg="' + ev.id + '">' +
    '<span class="kk-evicon">▤</span><span>' + esc(ev.title) +
    '<div class="kk-muted" style="font-size:12.5px">' + esc(ev.description || '') + '</div>' +
    '<div style="margin-top:5px">' + vbadge(ev.verification) + '</div></span></button>';
}

function checkinBadge(c){
  if(c.status === 'COMPLETED') return '<span class="kk-badge ok">✓ Completed</span>';
  if(c.status === 'OVERDUE') return '<span class="kk-badge warn">! Overdue</span>';
  if(c.status === 'DUE') return '<span class="kk-badge warn">Due</span>';
  return '<span class="kk-badge stop">Not due yet</span>';
}

/* ---- product detail ---------------------------------------------------- */
function vProduct(id){
  const p = sel.product(id);
  if(!p) return emptyState('Record not found','No product matches that identifier.');
  const pa = sel.participant(p.participantId), cur = sel.currentStatus(p.id);
  const hist = sel.history(p.id), evs = sel.evidenceOf(p.id), dom = sel.domainOf(p.id);
  const off = sel.isOff(p.id);
  const lastOn = hist.filter(h => STATUS_META[h.status].n !== null).slice(-1)[0];

  const ladder = '<div class="kk-ladder">' + STATUS.map(s => {
    const reached = sel.peakRank(p.id) >= STATUS_META[s].n;
    const at = !off && cur === s;
    const ev = hist.find(h => h.status === s);
    return '<div class="kk-step ' + (reached ? 'done' : 'todo') + (at ? ' now' : '') + '">' +
      '<span class="kk-dot"></span><span><span class="kk-sname">' + esc(STATUS_META[s].label) + '</span></span>' +
      '<span class="kk-sdate">' + (ev ? dt(ev.effectiveDate) : '') + '</span></div>';
  }).join('') + '</div>';

  const types = sel.metricTypesFor(p.id);
  const chartType = types.find(t => sel.series(p.id, t).length >= 3);

  return '<button class="kk-back" data-act="go" data-arg="products">← Product Observatory</button>' +
    '<h1 class="kk-h1">' + esc(productName(p)) + '</h1>' +
    '<p class="kk-lede">' + esc(p.description || 'No description on record.') + '</p>' +
    (off ? '<div class="kk-flag"><span>◇</span><div><b>' + esc(STATUS_META[cur].label) + '.</b> ' +

        '<div class="kk-panel"><div class="kk-sub" style="margin-bottom:4px">' + esc(METRIC_META[t].label) +

    '<section class="kk-section"><h2 class="kk-h2">Evidence</h2>' +
      (evs.length ? '<div class="kk-panel">' + evs.map(evRow).join('') + '</div>'
        : emptyState('No evidence on file','Any figure above therefore rests on the builder’s word alone.')) +
    '</section>';
}

/* =========================================================================
   VIEW: OUTCOMES
========================================================================= */
function vOutcomes(){
  const f = state.filters, ec = sel.economicValue(f);
  const ids = new Set(sel.participants(f).map(p => p.id));
  const outs = DB.outcomes.filter(o => ids.has(o.participantId));
  const pids = new Set(sel.products(f).map(p => p.id));
  const dom = DB.domainImpacts.filter(d => pids.has(d.productId));

  const group = g => outs.filter(o => OUTCOME_GROUP[o.type] === g);
  const outTable = list => list.length
    ? table(['Builder','Outcome','Detail','Attribution','Strength'], list.map(o => {
        const pa = sel.participant(o.participantId);
        return '<tr><td><button class="kk-linkcell" data-act="go" data-arg="builder:' + o.participantId + '">' +
          esc(participantName(pa)) + '</button></td><td>' + esc(OUTCOME_META[o.type]) + '</td>' +
          '<td class="kk-muted" style="font-size:12.5px">' + esc(o.description) +
          (o.financialValue ? ' <b>' + money(o.financialValue) + '</b>' : '') + '</td>' +
          '<td class="kk-muted">' + esc(ATTRIBUTION[o.attribution]) + '</td>' +
          '<td>' + vbadge(o.verification) + '</td></tr>';
      }).join(''))
    : emptyState('Nothing recorded in this category yet','No builder has reported an outcome of this kind, and none has been observed. Recorded as unknown rather than none.');

  const F = sel.funnel(f), g = k => F.find(x => x.k === k).n;

  return '<h1 class="kk-h1">Outcomes</h1>' +
    '<p class="kk-lede">What changed beyond the products themselves. Builder outcomes are tracked separately from product metrics, because a builder can gain a great deal from a product that earns nothing.</p>' +
    filterBar() + filterSummary() +

    '<section class="kk-section"><h2 class="kk-h2">Economic</h2>' +
      '<div class="kk-grid four">' +
        '<div class="kk-panel"><div class="kk-sub">Verified product revenue</div><div class="kk-fig" style="font-size:24px">' + money(ec.verifiedRevenue) + '</div></div>' +
        '<div class="kk-panel"><div class="kk-sub">Reported, unverified</div><div class="kk-fig" style="font-size:24px">' + money(ec.claimedRevenue) + '</div></div>' +
        '<div class="kk-panel"><div class="kk-sub">Builder income (self-reported)</div><div class="kk-fig" style="font-size:24px">' + (ec.builderIncome ? money(ec.builderIncome) : '—') + '</div></div>' +
        '<div class="kk-panel"><div class="kk-sub">Jobs created</div><div class="kk-fig" data-c="0" style="font-size:24px">—</div><div class="kk-gapcell">Not yet measured</div></div>' +
      '</div>' +
      '<p class="kk-sub" style="margin-top:10px">' + esc(DB.programmeRevenue.note) + '</p>' +
      '<div style="margin-top:12px">' + outTable(group('economic')) + '</div>' +
    '</section>' +

    '<section class="kk-section"><h2 class="kk-h2">Career</h2>' + outTable(group('career')) + '</section>' +

    '<section class="kk-section"><h2 class="kk-h2">Product</h2>' +
      '<div class="kk-grid four">' +
        '<div class="kk-panel"><div class="kk-sub">Products built</div><div class="kk-fig" style="font-size:24px">' + fmt(g('built')) + '</div></div>' +
        '<div class="kk-panel"><div class="kk-sub">Deployed</div><div class="kk-fig" style="font-size:24px">' + fmt(g('deployed')) + '</div></div>' +
        '<div class="kk-panel"><div class="kk-sub">With users</div><div class="kk-fig" style="font-size:24px">' + fmt(g('users')) + '</div></div>' +
        '<div class="kk-panel"><div class="kk-sub">With traction</div><div class="kk-fig" style="font-size:24px">' + fmt(g('traction')) + '</div></div>' +
      '</div>' +
      '<div style="margin-top:12px">' + outTable(group('product')) + '</div>' +
    '</section>' +

    '<section class="kk-section"><h2 class="kk-h2">Social and domain impact</h2>' +
      '<p class="kk-sub">Each product defines the measures that matter in its own sector. They are not forced into a common formula.</p>' +
      (dom.length ? table(['Product','Measure','Value','Methodology','Strength'], dom.map(d => {
        const p = sel.product(d.productId);
        return '<tr><td><button class="kk-linkcell" data-act="go" data-arg="product:' + d.productId + '">' +
          esc(productName(p)) + '</button></td><td>' + esc(d.metricName) + '</td>' +
          '<td class="num">' + fmt(d.value) + ' ' + esc(d.unit) + '</td>' +
          '<td class="kk-muted" style="font-size:12.5px">' + esc(d.methodology) + '</td>' +
          '<td>' + vbadge(d.verification) + '</td></tr>';
      }).join('')) : emptyState('No domain impact recorded yet','No product in scope has defined a sector measure.')) +
    '</section>' +

    (group('none').length ? '<section class="kk-section"><h2 class="kk-h2">Reported no outcome</h2>' +
      '<p class="kk-sub">Recorded deliberately. A system that only stores successes cannot tell you its own hit rate.</p>' +
      outTable(group('none')) + '</section>' : '');
}

/* =========================================================================
   VIEW: COHORTS
========================================================================= */
function vCohorts(){
  const cs = sel.cohorts(state.filters);
  return '<h1 class="kk-h1">Cohorts</h1>' +
    '<p class="kk-lede">Each delivery of a programme, with the figures the source material establishes and the figures still being measured.</p>' +
    filterBar() +
    '<div style="margin-bottom:14px"><button class="kk-btn sm ghost" data-act="go" data-arg="compare">Compare cohorts side by side</button></div>' +
    '<div class="kk-gallery">' + cs.map(c => {
      const canon = c.canonical;
      return '<button class="kk-card" data-act="go" data-arg="cohort:' + c.id + '">' +
        '<h5>' + esc(c.name) + '</h5>' +
        '<p>' + esc(c.note) + '</p>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        (canon.participants !== null ? '<span class="kk-pill">' + canon.participants + ' students</span>' : '<span class="kk-pill gap">Not yet run</span>') +
        (canon.countries.length ? '<span class="kk-pill">' + canon.countries.length + ' countries</span>' : '') +
        (canon.continents ? '<span class="kk-pill">' + canon.continents + ' continents</span>' : '') +
        (canon.productsShipped !== null ? '<span class="kk-pill">' + canon.productsShipped + ' shipped</span>' : '') +
